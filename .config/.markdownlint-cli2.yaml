# Markdown linting rules for Forge documentation
config:
  default: true

  # MD013: Line length
  MD013: false

  # MD022: Headings should be surrounded by blank lines
  # Disabled for CHANGELOG format where version sections are dense
  MD022: false

  # MD024: No duplicate headings
  # Disabled for CHANGELOG format where Added/Changed/Fixed repeat per version
  MD024: false

  # MD033: Allow inline HTML (needed for badges, etc)
  MD033: false

  # MD029: Allow different ordered list prefixes
  MD029: false

  # MD031: Allow code blocks without surrounding blank lines
  MD031: false

  # MD032: Lists should be surrounded by blank lines
  MD032: false

  # MD036: Allow emphasis as heading (status lines)
  MD036: false

  # MD034: Allow bare URLs
  MD034: false

  # MD051: Allow link fragments (internal links)
  MD051: false

  # MD041: First line doesn't have to be H1
  MD041: false

  # MD060: Ignore table column style breaks
  MD060: false

  # MD046: Code block style
  MD046:
    style: fenced
