# YAML linting configuration for Forge
extends: default

rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  comments:
    min-spaces-from-content: 1
  indentation: disable  # Kubernetes YAML uses its own indentation style
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no']
    check-keys: false
  brackets:
    max-spaces-inside: 1  # Allow single spaces in brackets for readability

# Ignore patterns
ignore: |
  vendor/
  bin/
  .git/
  config/samples/
  webhook/deploy/
  chart/forge/templates/
