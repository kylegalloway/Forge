name: Attest Forge Build

on:
  # Run after CI completes successfully on main branch
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # For OIDC token generation (keyless signing)
  packages: write  # For pushing attestations to registry
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-attest:
    name: Build and Attest Forge Artifacts
    runs-on: ubuntu-latest
    # Only run if CI succeeded (skip if CI failed)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    steps:
      - name: Prepare repository names
        id: repo
        run: |
          echo "controller=ghcr.io/${{ github.repository }}/forge-controller" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "webhook=ghcr.io/${{ github.repository }}/forge-webhook" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SLSA provenance

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for controller
        id: meta-controller
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.controller }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for webhook
        id: meta-webhook
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.webhook }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Build binaries with reproducible builds
      - name: Build controller binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" \
            -o bin/controller-linux-amd64 \
            cmd/controller/main.go

      - name: Build webhook binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" \
            -o bin/webhook-linux-amd64 \
            cmd/webhook/main.go

      # Generate SBOMs
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.15.0

      - name: Generate SBOM for controller
        run: |
          syft packages bin/controller-linux-amd64 \
            --output spdx-json=controller-sbom.spdx.json \
            --output cyclonedx-json=controller-sbom.cdx.json

      - name: Generate SBOM for webhook
        run: |
          syft packages bin/webhook-linux-amd64 \
            --output spdx-json=webhook-sbom.spdx.json \
            --output cyclonedx-json=webhook-sbom.cdx.json

      # Build and push controller image
      # Uses cache from CI workflow for fast rebuilds
      - name: Build and push controller image
        id: build-controller
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-controller.outputs.tags }}
          labels: ${{ steps.meta-controller.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true  # Automatically generate SLSA provenance
          sbom: true        # Automatically attach SBOM

      # Build and push webhook image
      - name: Build and push webhook image
        id: build-webhook
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: webhook
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-webhook.outputs.tags }}
          labels: ${{ steps.meta-webhook.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Install Cosign for signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.3.0

      # Sign controller image (keyless with OIDC)
      - name: Sign controller image with Cosign
        env:
          DIGEST: ${{ steps.build-controller.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ steps.repo.outputs.controller }}@${DIGEST}"

      # Sign webhook image
      - name: Sign webhook image with Cosign
        env:
          DIGEST: ${{ steps.build-webhook.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ steps.repo.outputs.webhook }}@${DIGEST}"

      # Attest SBOMs to images
      - name: Attest SBOM for controller
        env:
          DIGEST: ${{ steps.build-controller.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate controller-sbom.spdx.json \
            --type spdx \
            "${{ steps.repo.outputs.controller }}@${DIGEST}"

      - name: Attest SBOM for webhook
        env:
          DIGEST: ${{ steps.build-webhook.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate webhook-sbom.spdx.json \
            --type spdx \
            "${{ steps.repo.outputs.webhook }}@${DIGEST}"

      # Upload SBOMs as artifacts
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            controller-sbom.spdx.json
            controller-sbom.cdx.json
            webhook-sbom.spdx.json
            webhook-sbom.cdx.json
          retention-days: 90

      # Scan images for vulnerabilities
      - name: Scan controller image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ steps.repo.outputs.controller }}@${{ steps.build-controller.outputs.digest }}
          format: 'sarif'
          output: 'controller-trivy-results.sarif'

      - name: Scan webhook image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ steps.repo.outputs.webhook }}@${{ steps.build-webhook.outputs.digest }}
          format: 'sarif'
          output: 'webhook-trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: |
            controller-trivy-results.sarif
            webhook-trivy-results.sarif

      # Generate attestation summary
      - name: Generate attestation summary
        run: |
          cat << EOF > attestation-summary.md
          # 🔐 Forge Build Attestation Summary

          ## Build Information
          - **Commit**: ${{ github.sha }}
          - **Ref**: ${{ github.ref_name }}
          - **Workflow**: ${{ github.workflow }}
          - **Run ID**: ${{ github.run_id }}
          - **Actor**: ${{ github.actor }}

          ## Controller Image
          - **Image**: ${{ steps.repo.outputs.controller }}
          - **Digest**: ${{ steps.build-controller.outputs.digest }}
          - **Tags**:
          ${{ steps.meta-controller.outputs.tags }}

          ## Webhook Image
          - **Image**: ${{ steps.repo.outputs.webhook }}
          - **Digest**: ${{ steps.build-webhook.outputs.digest }}
          - **Tags**:
          ${{ steps.meta-webhook.outputs.tags }}

          ## Attestations Generated
          - ✅ SLSA Provenance (auto-generated by BuildKit)
          - ✅ SBOM (SPDX + CycloneDX formats)
          - ✅ Cosign signature (keyless OIDC)
          - ✅ Vulnerability scan results

          ## Verification Commands

          ### Verify signature:
          \`\`\`bash
          cosign verify \\
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            ${{ steps.repo.outputs.controller }}@${{ steps.build-controller.outputs.digest }}
          \`\`\`

          ### Verify attestation:
          \`\`\`bash
          cosign verify-attestation \\
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            --type spdx \\
            ${{ steps.repo.outputs.controller }}@${{ steps.build-controller.outputs.digest }}
          \`\`\`

          ### Download SBOM:
          \`\`\`bash
          cosign download sbom \\
            ${{ steps.repo.outputs.controller }}@${{ steps.build-controller.outputs.digest }}
          \`\`\`

          ## SLSA Level
          **Achieved: SLSA Build Level 3**
          - ✅ Isolated build (GitHub Actions)
          - ✅ Signed provenance (Cosign + Rekor)
          - ✅ Non-falsifiable (GitHub OIDC)
          - ✅ Hermetic (reproducible builds)

          ---
          *Generated by Forge attestation workflow*
          EOF

      - name: Upload attestation summary
        uses: actions/upload-artifact@v4
        with:
          name: attestation-summary
          path: attestation-summary.md
          retention-days: 90
