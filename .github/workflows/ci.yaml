name: CI

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.detect.outputs.go }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        run: |
          # workflow_dispatch always runs everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}")
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              FILES=$(git ls-tree -r --name-only HEAD)
            else
              FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            fi
          fi

          echo "Changed files:"
          echo "$FILES"

          GO_CHANGED=false
          DOCKER_CHANGED=false

          if echo "$FILES" | grep -qE '\.go$|^go\.(mod|sum)$|^\.config/|^\.github/workflows/ci\.yaml$'; then
            GO_CHANGED=true
          fi

          if echo "$FILES" | grep -qE '^Dockerfile$|^images/'; then
            DOCKER_CHANGED=true
          fi

          echo "go=$GO_CHANGED" >> "$GITHUB_OUTPUT"

          # Docker builds compile Go, so run when either changes
          if [ "$GO_CHANGED" = "true" ] || [ "$DOCKER_CHANGED" = "true" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  verify-codegen:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Generate CRDs and deepcopy code
        run: |
          make manifests
          make generate
          # Normalize imports to match project style (controller-gen uses unnamed, we use named)
          goimports -w pkg/apis/

      - name: Verify no changes
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated code is out of date. Run 'make manifests generate && goimports -w pkg/apis/' and commit the changes."
            git diff
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --config=.config/golangci.yaml --timeout=10m

      - name: Run go fmt
        run: |
          fmt_output=$(go fmt ./...)
          if [ -n "$fmt_output" ]; then
            echo "::error::Code is not formatted. Run 'go fmt ./...' to fix."
            echo "$fmt_output"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./pkg/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-forge

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      matrix:
        include:
          - target: controller
            path: cmd/controller
          - target: webhook
            path: cmd/webhook
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build ${{ matrix.target }}
        run: go build -v -o bin/${{ matrix.target }} ./${{ matrix.path }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: bin/${{ matrix.target }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: controller
          push: false
          tags: forge-controller:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build webhook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: webhook
          push: false
          tags: forge-webhook:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build zarfpackagejob image
        uses: docker/build-push-action@v6
        with:
          context: ./images/zarfpackagejob
          file: ./images/zarfpackagejob/Dockerfile
          push: false
          tags: zarfpackagejob:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build udsbundlejob image
        uses: docker/build-push-action@v6
        with:
          context: ./images/udsbundlejob
          file: ./images/udsbundlejob/Dockerfile
          push: false
          tags: udsbundlejob:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run gosec security scanner
        uses: securego/gosec@v2.21.4
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'gosec-results.sarif'

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [verify-codegen, lint, test, build, docker, security]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::One or more CI jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped"
