name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write  # For OIDC token generation (keyless signing)
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build, Attest, and Release
    runs-on: ubuntu-latest
    steps:
      - name: Prepare repository names
        id: repo
        run: |
          echo "controller=ghcr.io/${{ github.repository }}/forge-controller" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "webhook=ghcr.io/${{ github.repository }}/forge-webhook" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
          echo "zarf_cli=ghcr.io/${{ github.repository }}/zarf-cli" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for SLSA provenance

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v -race ./pkg/...

      - name: Set version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "full_version=${VERSION}" >> $GITHUB_OUTPUT

      # Build binaries with reproducible builds
      - name: Build binaries
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="${{ github.sha }}"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"

          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/controller-linux-amd64 ./cmd/controller
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/controller-linux-arm64 ./cmd/controller
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/webhook-linux-amd64 ./cmd/webhook
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/webhook-linux-arm64 ./cmd/webhook

          # Darwin (macOS)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/controller-darwin-amd64 ./cmd/controller
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/controller-darwin-arm64 ./cmd/controller
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/webhook-darwin-amd64 ./cmd/webhook
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o bin/webhook-darwin-arm64 ./cmd/webhook

      # Generate SBOMs for binaries
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.15.0

      - name: Generate SBOMs
        run: |
          syft packages bin/controller-linux-amd64 --output spdx-json=controller-sbom.spdx.json --output cyclonedx-json=controller-sbom.cdx.json
          syft packages bin/webhook-linux-amd64 --output spdx-json=webhook-sbom.spdx.json --output cyclonedx-json=webhook-sbom.cdx.json

      # Docker setup
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for images
      - name: Extract metadata for controller
        id: meta-controller
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.controller }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Extract metadata for webhook
        id: meta-webhook
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.webhook }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Extract metadata for zarf-cli
        id: meta-zarf-cli
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.zarf_cli }}
          tags: |
            type=raw,value=v0.68.1
            type=sha

      # Build and push images with attestation
      - name: Build and push controller image
        id: build-controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-controller.outputs.tags }}
          labels: ${{ steps.meta-controller.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true  # SLSA provenance
          sbom: true        # Attach SBOM

      - name: Build and push webhook image
        id: build-webhook
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: webhook
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-webhook.outputs.tags }}
          labels: ${{ steps.meta-webhook.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push zarf-cli image
        id: build-zarf-cli
        uses: docker/build-push-action@v6
        with:
          context: ./images/zarf-cli
          file: ./images/zarf-cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-zarf-cli.outputs.tags }}
          labels: ${{ steps.meta-zarf-cli.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Generate Docker build summary for all images
      - name: Generate Docker Build Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🐳 Docker Images Built

          ### Controller Image
          **Image:** `${{ steps.repo.outputs.controller }}`
          **Digest:** `${{ steps.build-controller.outputs.digest }}`
          **Platforms:** `linux/amd64`, `linux/arm64`

          **Tags:**
          ${{ steps.meta-controller.outputs.tags }}

          ### Webhook Image
          **Image:** `${{ steps.repo.outputs.webhook }}`
          **Digest:** `${{ steps.build-webhook.outputs.digest }}`
          **Platforms:** `linux/amd64`, `linux/arm64`

          **Tags:**
          ${{ steps.meta-webhook.outputs.tags }}

          ### Zarf CLI Image
          **Image:** `${{ steps.repo.outputs.zarf_cli }}`
          **Digest:** `${{ steps.build-zarf-cli.outputs.digest }}`
          **Platforms:** `linux/amd64`, `linux/arm64`

          **Tags:**
          ${{ steps.meta-zarf-cli.outputs.tags }}

          ---
          **Provenance:** ✅ SLSA Build Level 3
          **SBOM:** ✅ Attached
          **Signed:** ✅ Cosign (keyless OIDC)
          EOF

      # Install Cosign for signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.3.0

      # Sign images (keyless with OIDC)
      - name: Sign controller image
        env:
          DIGEST: ${{ steps.build-controller.outputs.digest }}
        run: |
          cosign sign --yes "${{ steps.repo.outputs.controller }}@${DIGEST}"

      - name: Sign webhook image
        env:
          DIGEST: ${{ steps.build-webhook.outputs.digest }}
        run: |
          cosign sign --yes "${{ steps.repo.outputs.webhook }}@${DIGEST}"

      - name: Sign zarf-cli image
        env:
          DIGEST: ${{ steps.build-zarf-cli.outputs.digest }}
        run: |
          cosign sign --yes "${{ steps.repo.outputs.zarf_cli }}@${DIGEST}"

      # Attest SBOMs to images
      - name: Attest SBOM for controller
        env:
          DIGEST: ${{ steps.build-controller.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate controller-sbom.spdx.json \
            --type spdx \
            "${{ steps.repo.outputs.controller }}@${DIGEST}"

      - name: Attest SBOM for webhook
        env:
          DIGEST: ${{ steps.build-webhook.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate webhook-sbom.spdx.json \
            --type spdx \
            "${{ steps.repo.outputs.webhook }}@${DIGEST}"

      # Vulnerability scanning
      - name: Scan controller image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.repo.outputs.controller }}@${{ steps.build-controller.outputs.digest }}
          format: 'sarif'
          output: 'controller-trivy-results.sarif'

      - name: Scan webhook image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.repo.outputs.webhook }}@${{ steps.build-webhook.outputs.digest }}
          format: 'sarif'
          output: 'webhook-trivy-results.sarif'

      - name: Scan zarf-cli image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.repo.outputs.zarf_cli }}@${{ steps.build-zarf-cli.outputs.digest }}
          format: 'sarif'
          output: 'zarf-cli-trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: |
            controller-trivy-results.sarif
            webhook-trivy-results.sarif
            zarf-cli-trivy-results.sarif

      # Package Helm chart
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          helm package chart/forge \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination .

      - name: Create Helm repository index
        run: |
          helm repo index . \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.full_version }}"

      # Generate release notes
      - name: Generate attestation summary
        run: |
          cat << EOF > RELEASE_NOTES.md
          # 🔐 Forge Release ${{ steps.version.outputs.full_version }}

          ## Container Images

          ### Controller
          \`\`\`
          ${{ steps.repo.outputs.controller }}@${{ steps.build-controller.outputs.digest }}
          \`\`\`

          **Tags:**
          $(echo "${{ steps.meta-controller.outputs.tags }}" | sed 's/^/- /')

          ### Webhook
          \`\`\`
          ${{ steps.repo.outputs.webhook }}@${{ steps.build-webhook.outputs.digest }}
          \`\`\`

          **Tags:**
          $(echo "${{ steps.meta-webhook.outputs.tags }}" | sed 's/^/- /')

          ### Zarf CLI
          \`\`\`
          ${{ steps.repo.outputs.zarf_cli }}@${{ steps.build-zarf-cli.outputs.digest }}
          \`\`\`

          **Tags:**
          $(echo "${{ steps.meta-zarf-cli.outputs.tags }}" | sed 's/^/- /')

          ## Helm Chart

          Add the Helm repository:
          \`\`\`bash
          helm repo add forge https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          helm repo update
          helm install forge forge/forge --version ${{ steps.version.outputs.version }}
          \`\`\`

          Or install directly from release:
          \`\`\`bash
          helm install forge https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.full_version }}/forge-${{ steps.version.outputs.version }}.tgz
          \`\`\`

          ## Security Attestations

          ### Verify Image Signature
          \`\`\`bash
          cosign verify \\
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            ${{ steps.repo.outputs.controller }}@${{ steps.build-controller.outputs.digest }}
          \`\`\`

          ### Verify SBOM Attestation
          \`\`\`bash
          cosign verify-attestation \\
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            --type spdx \\
            ${{ steps.repo.outputs.controller }}@${{ steps.build-controller.outputs.digest }}
          \`\`\`

          ### Download SBOM
          \`\`\`bash
          cosign download sbom ${{ steps.repo.outputs.controller }}@${{ steps.build-controller.outputs.digest }}
          \`\`\`

          ## SLSA Provenance

          **SLSA Build Level 3** achieved:
          - ✅ Isolated build (GitHub Actions)
          - ✅ Signed provenance (Cosign + Rekor transparency log)
          - ✅ Non-falsifiable (GitHub OIDC)
          - ✅ Hermetic builds (reproducible)

          ## Multi-Architecture Support

          All images support:
          - \`linux/amd64\`
          - \`linux/arm64\`

          ## Checksums

          Binary checksums available in release artifacts.
          EOF

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.full_version }}
          body_path: RELEASE_NOTES.md
          files: |
            bin/*
            *.spdx.json
            *.cdx.json
            forge-${{ steps.version.outputs.version }}.tgz
            index.yaml
          generate_release_notes: true
          draft: false
          prerelease: false

      # Publish to GitHub Pages (optional - for Helm repository)
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm repository on gh-pages
        run: |
          # Copy chart package to gh-pages
          cp forge-${{ steps.version.outputs.version }}.tgz gh-pages/

          # Regenerate index with all charts
          cd gh-pages
          helm repo index . --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release Helm chart ${{ steps.version.outputs.version }}" || true
          git push origin gh-pages
