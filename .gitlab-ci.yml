# GitLab CI/CD configuration for Forge

stages:
  - lint
  - test
  - build
  - security
  - release

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  GO_VERSION: "1.25"

# Default configuration
default:
  image: golang:${GO_VERSION}
  before_script:
    - go version
    - go env

# Caching for Go modules
.go-cache:
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .go/pkg/mod/
    policy: pull-push

# Lint stage
go-fmt:
  extends: .go-cache
  stage: lint
  script:
    - gofmt -l . | tee fmt-output.txt
    - test ! -s fmt-output.txt
  artifacts:
    paths:
      - fmt-output.txt
    when: on_failure
    expire_in: 1 week

go-vet:
  extends: .go-cache
  stage: lint
  script:
    - go vet ./...

golangci-lint:
  extends: .go-cache
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run --timeout=10m --out-format=colored-line-number

go-mod-tidy:
  extends: .go-cache
  stage: lint
  script:
    - go mod tidy
    - git diff --exit-code go.mod go.sum
  allow_failure: false

pre-commit:
  stage: lint
  image: python:3.12
  before_script:
    - pip install pre-commit
    - curl -LO https://golang.org/dl/go${GO_VERSION}.linux-amd64.tar.gz
    - tar -C /usr/local -xzf go${GO_VERSION}.linux-amd64.tar.gz
    - export PATH=$PATH:/usr/local/go/bin
  script:
    - pre-commit run --all-files --show-diff-on-failure
  cache:
    key: pre-commit-${CI_COMMIT_REF_SLUG}
    paths:
      - ~/.cache/pre-commit

# Test stage
unit-tests:
  extends: .go-cache
  stage: test
  script:
    - go test -v -race -coverprofile=coverage.out -covermode=atomic ./pkg/...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage.out
      - coverage.html
    expire_in: 1 week

integration-tests:
  extends: .go-cache
  stage: test
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - ./scripts/test-e2e.sh
  only:
    - main
    - develop
    - merge_requests

# Build stage
build-controller:
  extends: .go-cache
  stage: build
  script:
    - go build -v -o bin/controller ./cmd/controller
  artifacts:
    paths:
      - bin/controller
    expire_in: 1 week

build-webhook:
  extends: .go-cache
  stage: build
  script:
    - go build -v -o bin/webhook ./cmd/webhook
  artifacts:
    paths:
      - bin/webhook
    expire_in: 1 week

build-multi-arch:
  extends: .go-cache
  stage: build
  script:
    - GOOS=linux GOARCH=amd64 go build -o bin/controller-linux-amd64 ./cmd/controller
    - GOOS=linux GOARCH=arm64 go build -o bin/controller-linux-arm64 ./cmd/controller
    - GOOS=darwin GOARCH=amd64 go build -o bin/controller-darwin-amd64 ./cmd/controller
    - GOOS=darwin GOARCH=arm64 go build -o bin/controller-darwin-arm64 ./cmd/controller
  artifacts:
    paths:
      - bin/
    expire_in: 1 week
  only:
    - tags
    - main

docker-build-controller:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker info
  script:
    - docker build -t forge-controller:${CI_COMMIT_SHA} -f Dockerfile .
    - docker images
  only:
    - main
    - develop
    - tags

docker-build-webhook:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker info
  script:
    - docker build -t forge-webhook:${CI_COMMIT_SHA} -f webhook/Dockerfile ./webhook
    - docker images
  only:
    - main
    - develop
    - tags

# Security stage
trivy-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --format json --output trivy-results.json .
    - trivy fs --severity HIGH,CRITICAL --format template --template "@/contrib/sarif.tpl" --output trivy-results.sarif .
  artifacts:
    reports:
      sast: trivy-results.sarif
    paths:
      - trivy-results.json
    expire_in: 1 week
  allow_failure: true

gosec-scan:
  extends: .go-cache
  stage: security
  before_script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
  script:
    - gosec -fmt json -out gosec-results.json ./...
    - gosec -fmt sarif -out gosec-results.sarif ./...
  artifacts:
    reports:
      sast: gosec-results.sarif
    paths:
      - gosec-results.json
    expire_in: 1 week
  allow_failure: true

# Release stage (only on tags)
release:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build and push controller
    - docker build -t $CI_REGISTRY_IMAGE/forge-controller:${CI_COMMIT_TAG} -f Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/forge-controller:${CI_COMMIT_TAG}
    - docker tag $CI_REGISTRY_IMAGE/forge-controller:${CI_COMMIT_TAG} $CI_REGISTRY_IMAGE/forge-controller:latest
    - docker push $CI_REGISTRY_IMAGE/forge-controller:latest

    # Build and push webhook
    - docker build -t $CI_REGISTRY_IMAGE/forge-webhook:${CI_COMMIT_TAG} -f webhook/Dockerfile ./webhook
    - docker push $CI_REGISTRY_IMAGE/forge-webhook:${CI_COMMIT_TAG}
    - docker tag $CI_REGISTRY_IMAGE/forge-webhook:${CI_COMMIT_TAG} $CI_REGISTRY_IMAGE/forge-webhook:latest
    - docker push $CI_REGISTRY_IMAGE/forge-webhook:latest
  only:
    - tags

# Release creation
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies:
    - build-multi-arch
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: 'Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'Controller (Linux AMD64)'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/bin/controller-linux-amd64'
        - name: 'Controller (Linux ARM64)'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/bin/controller-linux-arm64'
        - name: 'Controller (Darwin AMD64)'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/bin/controller-darwin-amd64'
        - name: 'Controller (Darwin ARM64)'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/bin/controller-darwin-arm64'
  only:
    - tags
