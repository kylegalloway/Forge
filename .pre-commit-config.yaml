# Pre-commit hooks for Forge
# See https://pre-commit.com for more information

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^go\.(mod|sum)$'
      - id: end-of-file-fixer
        exclude: '^go\.(mod|sum)$'
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags for Kubernetes
        exclude: '^(examples/samples/zarf/01-git-to-oci/chart/templates/|chart/forge/templates/)'
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key
        exclude: '^(docs/|examples/)'

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-c', '.config/yamllint.yaml']
        exclude: '^(examples/samples/zarf/01-git-to-oci/chart/templates/|chart/forge/templates/)'

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        args: ['--ignore', 'DL3018', '--ignore', 'DL3008']

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.19.0 # Use the latest stable version
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".config/.markdownlint-cli2.yaml"]

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '^(go\.sum|\.secrets\.baseline|examples/|docs/rca/|docs/development/|.*zz_generated\..*\.go)'

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']

  # Go linting
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.7.2
    hooks:
      - id: golangci-lint
        args: ['--config=.config/golangci.yaml', '--timeout=10m']

  # Golang formatting and checks
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        args: ['-w']
      - id: go-imports
        args: ['-w']
      - id: go-mod-tidy
      - id: go-build
        args: ['./cmd/controller', './cmd/webhook']
      - id: go-unit-tests
        args: ['./pkg/...']

  # Git commit message linting
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]

# Configuration for specific file types
files: ''
exclude: '^(vendor/|\.git/|bin/|\.vscode/)'
fail_fast: false
