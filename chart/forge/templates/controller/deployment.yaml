apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forge.fullname" . }}-controller
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "forge.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "forge.controller.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.controller.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "forge.serviceAccountName" . }}
      automountServiceAccountToken: true  # Controller needs API access
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      containers:
      - name: controller
        image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.Version }}"
        imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
        command:
        - /controller
        args:
        {{- with .Values.controller.args }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if gt (int .Values.controller.concurrency.maxJobsPerNamespace) 0 }}
          - "--max-concurrent-jobs-per-namespace={{ .Values.controller.concurrency.maxJobsPerNamespace }}"
        {{- end }}
        {{- if gt (int .Values.controller.concurrency.maxJobsGlobal) 0 }}
          - "--max-concurrent-jobs-global={{ .Values.controller.concurrency.maxJobsGlobal }}"
        {{- end }}
        {{- if .Values.leaderElection.enabled }}
          - "--enable-leader-election"
          - "--leader-election-lease-duration={{ .Values.leaderElection.leaseDuration }}"
          - "--leader-election-renew-deadline={{ .Values.leaderElection.renewDeadline }}"
          - "--leader-election-retry-period={{ .Values.leaderElection.retryPeriod }}"
          - "--leader-election-namespace={{ include "forge.namespace" . }}"
        {{- end }}
        {{- if ne (int .Values.controller.workers) 2 }}
          - "--workers={{ .Values.controller.workers }}"
        {{- end }}
        env:
        - name: FORGE_ZARF_CLI_IMAGE
          value: "{{ .Values.zarfCLI.image.repository }}:{{ .Values.zarfCLI.image.tag }}"
        - name: FORGE_UDS_CLI_IMAGE
          value: "{{ .Values.udsCLI.image.repository }}:{{ .Values.udsCLI.image.tag }}"
        - name: FORGE_GIT_CLONE_IMAGE
          value: "{{ .Values.initContainerImages.gitClone }}"
        - name: FORGE_AWS_CLI_IMAGE
          value: "{{ .Values.initContainerImages.awsCli }}"
        - name: FORGE_CRANE_IMAGE
          value: "{{ .Values.initContainerImages.crane }}"
        - name: FORGE_DEBUG_MODE
          value: "{{ .Values.debugMode }}"
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        resources:
          {{- toYaml .Values.controller.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.controller.securityContext | nindent 10 }}
        {{- with .Values.controller.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.controller.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.controller.affinity }}
      affinity:
        {{- toYaml .Values.controller.affinity | nindent 8 }}
      {{- else if gt (int .Values.controller.replicaCount) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  {{- include "forge.controller.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
