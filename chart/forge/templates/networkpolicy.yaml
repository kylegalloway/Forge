{{- if .Values.networkPolicies.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "forge.fullname" . }}-controller
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.controller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "forge.controller.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- with .Values.networkPolicies.controller.ingress }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  egress:
  {{- with .Values.networkPolicies.controller.egress }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
