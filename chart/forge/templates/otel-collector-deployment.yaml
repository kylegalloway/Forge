{{- if and .Values.observability.otelCollector.enabled .Values.observability.deployStack -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forge.fullname" . }}-otel-collector
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.otel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.observability.otelCollector.replicaCount }}
  selector:
    matchLabels:
      {{- include "forge.otel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "forge.otel.selectorLabels" . | nindent 8 }}
        component: observability
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/otel-collector-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "forge.fullname" . }}-otel-collector
      containers:
      - name: otel-collector
        image: "{{ .Values.observability.otelCollector.image.repository }}:{{ .Values.observability.otelCollector.image.tag }}"
        imagePullPolicy: {{ .Values.observability.otelCollector.image.pullPolicy }}
        args:
          - --config=/conf/otel-collector-config.yaml
        ports:
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        - name: prometheus
          containerPort: 8889
          protocol: TCP
        - name: health
          containerPort: 13133
          protocol: TCP
        - name: pprof
          containerPort: 1777
          protocol: TCP
        - name: zpages
          containerPort: 55679
          protocol: TCP
        volumeMounts:
        - name: otel-collector-config
          mountPath: /conf
        resources:
          {{- toYaml .Values.observability.otelCollector.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
      volumes:
      - name: otel-collector-config
        configMap:
          name: {{ include "forge.fullname" . }}-otel-collector-config
          items:
            - key: otel-collector-config.yaml
              path: otel-collector-config.yaml
{{- end }}
