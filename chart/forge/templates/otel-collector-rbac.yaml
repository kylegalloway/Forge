{{- if and .Values.observability.otelCollector.enabled .Values.observability.deployStack -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forge.fullname" . }}-otel-collector
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.otel.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "forge.fullname" . }}-otel-collector
  labels:
    {{- include "forge.otel.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs:
  - /metrics
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "forge.fullname" . }}-otel-collector
  labels:
    {{- include "forge.otel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "forge.fullname" . }}-otel-collector
subjects:
- kind: ServiceAccount
  name: {{ include "forge.fullname" . }}-otel-collector
  namespace: {{ include "forge.namespace" . }}
{{- end }}
