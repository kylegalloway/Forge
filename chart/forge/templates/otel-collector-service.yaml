{{- if and .Values.observability.otelCollector.enabled .Values.observability.deployStack -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "forge.fullname" . }}-otel-collector
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.otel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.observability.otelCollector.service.type }}
  ports:
  - name: otlp-grpc
    port: {{ .Values.observability.otelCollector.service.ports.otlpGrpc }}
    targetPort: 4317
    protocol: TCP
  - name: otlp-http
    port: {{ .Values.observability.otelCollector.service.ports.otlpHttp }}
    targetPort: 4318
    protocol: TCP
  - name: prometheus
    port: {{ .Values.observability.otelCollector.service.ports.prometheus }}
    targetPort: 8889
    protocol: TCP
  - name: health
    port: {{ .Values.observability.otelCollector.service.ports.health }}
    targetPort: 13133
    protocol: TCP
  selector:
    {{- include "forge.otel.selectorLabels" . | nindent 4 }}
{{- end }}
