{{- if and .Values.webhook.enabled .Values.webhook.tls.autoGenerate -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forge.fullname" . }}-cabundle-patcher
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cabundle-patcher
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "forge.fullname" . }}-cabundle-patcher
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cabundle-patcher
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingwebhookconfigurations"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "forge.fullname" . }}-cabundle-patcher
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cabundle-patcher
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "forge.fullname" . }}-cabundle-patcher
subjects:
- kind: ServiceAccount
  name: {{ include "forge.fullname" . }}-cabundle-patcher
  namespace: {{ include "forge.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "forge.fullname" . }}-cabundle-patcher
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cabundle-patcher
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "forge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cabundle-patcher
    spec:
      serviceAccountName: {{ include "forge.fullname" . }}-cabundle-patcher
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cabundle-patcher
        image: registry.k8s.io/ingress-nginx/kube-webhook-certgen:v1.4.4
        imagePullPolicy: IfNotPresent
        args:
        - patch
        - --webhook-name={{ include "forge.fullname" . }}-webhook
        - --namespace={{ include "forge.namespace" . }}
        - --secret-name={{ .Values.webhook.tls.secretName }}
        - --patch-validating=true
        - --patch-mutating=false
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
{{- end }}
