{{- if .Values.webhook.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "forge.fullname" . }}-webhook
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  type: ClusterIP
  ports:
  - port: 443
    targetPort: webhook
    protocol: TCP
    name: webhook
  - port: 8080
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    {{- include "forge.webhook.selectorLabels" . | nindent 4 }}
{{- end }}
