{{- if and .Values.webhook.enabled .Values.webhook.tls.autoGenerate -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forge.fullname" . }}-cert-generator
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "forge.fullname" . }}-cert-generator
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "forge.fullname" . }}-cert-generator
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "forge.fullname" . }}-cert-generator
subjects:
- kind: ServiceAccount
  name: {{ include "forge.fullname" . }}-cert-generator
  namespace: {{ include "forge.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "forge.fullname" . }}-cert-generator
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "forge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cert-generator
    spec:
      serviceAccountName: {{ include "forge.fullname" . }}-cert-generator
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cert-generator
        image: registry.k8s.io/ingress-nginx/kube-webhook-certgen:v20231226-1a7112e06
        imagePullPolicy: IfNotPresent
        args:
        - create
        - --host={{ include "forge.fullname" . }}-webhook.{{ include "forge.namespace" . }}.svc,{{ include "forge.fullname" . }}-webhook.{{ include "forge.namespace" . }}.svc.{{ .Values.clusterDomain | default "cluster.local" }}
        - --namespace={{ include "forge.namespace" . }}
        - --secret-name={{ .Values.webhook.tls.secretName }}
        - --key-name=tls.key
        - --cert-name=tls.crt
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
{{- end }}
