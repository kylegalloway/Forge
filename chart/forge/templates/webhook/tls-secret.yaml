{{- if and .Values.webhook.enabled .Values.webhook.tls.autoGenerate -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forge.fullname" . }}-cert-generator
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "forge.fullname" . }}-cert-generator
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "forge.fullname" . }}-cert-generator
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "forge.fullname" . }}-cert-generator
subjects:
- kind: ServiceAccount
  name: {{ include "forge.fullname" . }}-cert-generator
  namespace: {{ include "forge.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "forge.fullname" . }}-cert-generator
  namespace: {{ include "forge.namespace" . }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-generator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "forge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cert-generator
    spec:
      serviceAccountName: {{ include "forge.fullname" . }}-cert-generator
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cert-generator
        image: alpine/openssl:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -e

          # Generate self-signed certificate
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/tls.key \
            -out /tmp/tls.crt \
            -days 365 \
            -subj "/CN={{ include "forge.fullname" . }}-webhook.{{ include "forge.namespace" . }}.svc" \
            -addext "subjectAltName=DNS:{{ include "forge.fullname" . }}-webhook.{{ include "forge.namespace" . }}.svc,DNS:{{ include "forge.fullname" . }}-webhook.{{ include "forge.namespace" . }}.svc.cluster.local"

          # Install kubectl
          apk add --no-cache curl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl

          # Check if secret exists
          if ./kubectl get secret {{ .Values.webhook.tls.secretName }} -n {{ include "forge.namespace" . }} 2>/dev/null; then
            echo "Secret {{ .Values.webhook.tls.secretName }} already exists, updating..."
            ./kubectl create secret tls {{ .Values.webhook.tls.secretName }} \
              --cert=/tmp/tls.crt \
              --key=/tmp/tls.key \
              --dry-run=client -o yaml | \
              ./kubectl apply -f -
          else
            echo "Creating secret {{ .Values.webhook.tls.secretName }}..."
            ./kubectl create secret tls {{ .Values.webhook.tls.secretName }} \
              --cert=/tmp/tls.crt \
              --key=/tmp/tls.key \
              -n {{ include "forge.namespace" . }}
          fi

          echo "Certificate generated and secret created successfully"
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
{{- end }}
