{{- if .Values.webhook.enabled -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "forge.fullname" . }}-webhook
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
  {{- if eq .Values.webhook.tls.mode "certManager" }}
  annotations:
    cert-manager.io/inject-ca-from: {{ include "forge.namespace" . }}/{{ .Values.webhook.tls.secretName }}
  {{- end }}
webhooks:
- name: zarfpackagejob.forge.dev
  clientConfig:
    service:
      name: {{ include "forge.fullname" . }}-webhook
      namespace: {{ include "forge.namespace" . }}
      path: /validate
    {{- if and (ne .Values.webhook.tls.mode "certManager") .Values.webhook.tls.caBundle }}
    caBundle: {{ .Values.webhook.tls.caBundle }}
    {{- end }}
  rules:
  - apiGroups: ["forge.dev"]
    apiVersions: ["v1alpha1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["zarfpackagejobs"]
    scope: "Namespaced"
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: {{ .Values.webhook.reliability.failurePolicy }}
  timeoutSeconds: {{ .Values.webhook.reliability.timeoutSeconds }}
{{- end }}
