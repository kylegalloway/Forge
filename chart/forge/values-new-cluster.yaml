# Values for deploying Forge into a new cluster
# with full observability stack (Grafana, Prometheus, OTEL)
#
# Usage:
#   helm upgrade --install forge ./chart/forge -f chart/forge/values-new-cluster.yaml

# Observability stack configuration
observability:
  # Deploy full observability stack
  deployStack: true

  # OpenTelemetry Collector configuration
  otelCollector:
    # Enable OTEL Collector deployment
    enabled: true

    # Increase resources for production use
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi

  # Prometheus configuration
  prometheus:
    # Enable Prometheus deployment
    enabled: true

    # Prometheus configuration
    config:
      # Enable persistence
      persistence:
        enabled: true
        size: 100Gi
        # Specify storage class if needed
        # storageClass: "fast-ssd"

      # Set retention period
      retention: 30d

      # Production resource limits
      resources:
        requests:
          cpu: 1000m
          memory: 4Gi
        limits:
          cpu: 4000m
          memory: 8Gi

      # Service configuration
      service:
        type: ClusterIP
        port: 9090

  # Grafana configuration
  grafana:
    # Enable Grafana deployment
    enabled: true

    config:
      # Set strong admin password
      adminPassword: "CHANGE-ME-STRONG-PASSWORD"

      # Production resource limits
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

      # Enable persistence
      persistence:
        enabled: true
        size: 20Gi
        # Specify storage class if needed
        # storageClass: "standard"

      # Enable ingress for external access
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
        hosts:
          - grafana.example.com
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.example.com

# Metrics configuration
metrics:
  enabled: true
  serviceMonitor:
    enabled: true

# Prometheus alerts configuration
alerts:
  enabled: true

# Network policies
networkPolicies:
  # Enable network policies for better security
  enabled: true

# Controller configuration
controller:
  # Scale up for production
  replicaCount: 2

  # Production resource limits
  resources:
    limits:
      cpu: "2"
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
