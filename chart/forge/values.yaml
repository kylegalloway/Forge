# Forge Helm Chart - Default Values
#
# Simple, minimal configuration for deploying Forge controller and webhook.
# External monitoring infrastructure can scrape metrics endpoints directly.

# Global settings
global:
  # Namespace to deploy into
  namespace: forge-system

  # Whether to create the namespace
  createNamespace: true

# Controller configuration
controller:
  # Enable controller deployment
  enabled: true

  # Number of controller replicas
  replicaCount: 1

  # Controller image configuration
  image:
    repository: ghcr.io/kylegalloway/forge-controller
    pullPolicy: IfNotPresent
    tag: "latest"

  # Image pull secrets (add if using private registry)
  imagePullSecrets: []

  # Controller command arguments
  args:
    - "-v=2"

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Security context for the controller pod
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  # Security context for the controller container
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    runAsNonRoot: true
    runAsUser: 65532
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

  # Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20

  # Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

  # Pod annotations (Prometheus scraping annotations)
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

  # Metrics endpoint configuration
  metrics:
    enabled: true
    port: 8080
    path: /metrics

  # Health check endpoints
  healthCheck:
    port: 8081
    livenessPath: /healthz
    readinessPath: /readyz

# Webhook Configuration
webhook:
  # Enable webhook deployment
  enabled: true

  # Number of webhook replicas (recommend 2+ for HA)
  replicaCount: 2

  # Webhook image configuration
  image:
    repository: ghcr.io/kylegalloway/forge-webhook
    pullPolicy: IfNotPresent
    tag: "latest"

  # Resource limits and requests
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # TLS configuration for admission webhook
  tls:
    # Auto-generate self-signed certs (dev only) or provide via secret
    autoGenerate: true
    secretName: forge-webhook-tls  # pragma: allowlist secret
    # CA bundle (base64 encoded) - leave empty for auto-generated certs
    caBundle: ""

  # Webhook metrics endpoint
  metrics:
    enabled: true
    port: 8080
    path: /metrics

# Zarf CLI image for Jobs
zarfCLI:
  image:
    repository: localhost/zarf
    tag: v0.66.0
    pullPolicy: IfNotPresent

# Service Account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "forge-controller"

# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true

# Leader Election (for HA controller)
leaderElection:
  enabled: true

# Network policies
networkPolicies:
  # Enable network policies (recommended for production)
  enabled: false

  # Controller network policy
  controller:
    # Ingress rules - what can connect TO the controller
    ingress:
      # Allow metrics scraping from monitoring namespace
      - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        ports:
        - protocol: TCP
          port: 8080
      # Allow health checks from anywhere (for kubelet probes)
      - from:
        - namespaceSelector: {}
        ports:
        - protocol: TCP
          port: 8081

    # Egress rules - what the controller can connect TO
    egress:
      # Allow DNS resolution
      - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
        ports:
        - protocol: UDP
          port: 53
      # Allow Kubernetes API access
      - to:
        - namespaceSelector: {}
        ports:
        - protocol: TCP
          port: 6443
      - to:
        - namespaceSelector: {}
        ports:
        - protocol: TCP
          port: 443

# Pod Security Standards
podSecurityStandards:
  # Enforce restricted pod security standard
  enforce: restricted
  audit: restricted
  warn: restricted

# CRD configuration
crds:
  # Install CRDs (ZarfPackageJob, etc.)
  install: true

  # Keep CRDs on helm uninstall (prevents accidental data loss)
  keep: true
