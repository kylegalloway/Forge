    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ZarfPackageJob is a Forge job specification for Zarf package operations.
          This is NOT a Zarf package definition - it's a job spec telling Forge what to do.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ZarfPackageJobSpec defines the desired state of a ZarfPackageJob

              This is a job specification that tells Forge what operations to perform on Zarf packages.
              It is NOT a Zarf package definition (which uses zarf.yaml format).
            properties:
              action:
                description: Action specifies what operation(s) to perform
                enum:
                - Build
                - Publish
                - Deploy
                - BuildPublish
                - BuildDeploy
                - PublishDeploy
                - BuildPublishDeploy
                type: string
              build:
                description: Build defines configuration for building the package
                  (optional)
                properties:
                  retry:
                    description: Retry policy for build failures
                    properties:
                      backoffMultiplier:
                        default: 2
                        description: BackoffMultiplier for exponential backoff
                        type: number
                      initialBackoff:
                        default: 30s
                        description: InitialBackoff is the delay before first retry
                          (e.g., "30s", "1m")
                        type: string
                      maxBackoff:
                        default: 5m
                        description: MaxBackoff is the maximum delay between retries
                        type: string
                      maxRetries:
                        default: 3
                        description: MaxRetries is the maximum number of retry attempts
                        format: int32
                        maximum: 10
                        minimum: 0
                        type: integer
                      retryableErrors:
                        description: |-
                          RetryableErrors defines which error patterns should trigger retries
                          Supports glob patterns (e.g., "*timeout*", "*throttle*")
                          If empty, all failures are retryable
                        items:
                          type: string
                        type: array
                    type: object
                  timeout:
                    default: 1h
                    description: Timeout for the build operation
                    type: string
                type: object
              deploy:
                description: Deploy defines how to deploy the package (required if
                  action includes Deploy)
                properties:
                  adoptionPolicy:
                    allOf:
                    - enum:
                      - Adopt
                      - Skip
                      - Error
                    - enum:
                      - Adopt
                      - Skip
                      - Error
                    default: Error
                    description: AdoptionPolicy defines how to handle existing resources
                    type: string
                  components:
                    description: Components to deploy (if not specified, deploys all)
                    items:
                      type: string
                    type: array
                  externalCluster:
                    description: ExternalCluster configuration (required if target=ExternalCluster)
                    properties:
                      context:
                        description: Context is the kubeconfig context to use
                        type: string
                      kubeconfigSecretRef:
                        description: KubeconfigSecretRef references a Secret containing
                          the kubeconfig
                        properties:
                          name:
                            description: Name of the secret
                            type: string
                          namespace:
                            description: Namespace of the secret (defaults to resource
                              namespace)
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - kubeconfigSecretRef
                    type: object
                  namespace:
                    default: default
                    description: Namespace to deploy into
                    type: string
                  resourceSelector:
                    description: |-
                      ResourceSelector specifies how to discover existing resources to adopt
                      Only used when AdoptionPolicy is "Adopt"
                    properties:
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels selects resources with all specified
                          labels
                        type: object
                      matchNames:
                        description: |-
                          MatchNames selects resources by exact name match
                          Supports glob patterns (e.g., "app-*", "service-?-prod")
                        items:
                          type: string
                        type: array
                      namespaces:
                        description: Namespaces to search in (defaults to deploy.namespace)
                        items:
                          type: string
                        type: array
                      validateOwnership:
                        default: true
                        description: ValidateOwnership ensures resources don't already
