                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              serviceAccountName:
                description: |-
                  ServiceAccountName references the ServiceAccount that defines permissions for this job
                  The ServiceAccount must have forge.dev/* annotations defining allowed actions
                  Cluster admins control what users can do by creating ServiceAccounts with appropriate annotations
                type: string
              source:
                description: Source defines where the package definition or artifact
                  comes from
                properties:
                  git:
                    description: Git source configuration (required if type=Git)
                    properties:
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef references a Secret with Git credentials
                          Secret should contain 'ssh-key' or 'token' key
                        properties:
                          name:
                            description: Name of the secret
                            type: string
                          namespace:
                            description: Namespace of the secret (defaults to resource
                              namespace)
                            type: string
                        required:
                        - name
                        type: object
                      disableCloneCredentials:
                        default: false
                        description: DisableCloneCredentials prevents using the credentials
                          for clone operations
                        type: boolean
                      path:
                        default: .
                        description: Path to the zarf.yaml within the repository
                        type: string
                      ref:
                        description: Ref is the branch, tag, or commit to checkout
                        type: string
                      url:
                        description: URL of the Git repository
                        pattern: ^https://.*
                        type: string
                    required:
                    - ref
                    - url
                    type: object
                  local:
                    description: Local source configuration (required if type=Local,
                      dev/testing only)
                    properties:
                      devMode:
                        description: DevMode must be explicitly set to true for local
                          sources
                        type: boolean
                      path:
                        description: Path to the local directory or file
                        type: string
                    required:
                    - devMode
                    - path
                    type: object
                  oci:
                    description: OCI source configuration (required if type=OCI)
                    properties:
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef references a Secret with registry credentials
                          Secret should be type kubernetes.io/dockerconfigjson
                        properties:
                          name:
                            description: Name of the secret
                            type: string
                          namespace:
                            description: Namespace of the secret (defaults to resource
                              namespace)
                            type: string
                        required:
                        - name
                        type: object
                      image:
                        description: Image is the full OCI image reference (registry/repo:tag
                          or @digest)
                        type: string
                    required:
                    - image
                    type: object
                  s3:
                    description: S3 source configuration (required if type=S3)
                    properties:
                      bucket:
                        description: Bucket name
                        type: string
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef references a Secret with AWS credentials
                          Secret should contain 'access-key-id' and 'secret-access-key'
                        properties:
                          name:
                            description: Name of the secret
                            type: string
                          namespace:
                            description: Namespace of the secret (defaults to resource
                              namespace)
                            type: string
                        required:
                        - name
                        type: object
                      key:
                        description: Key is the object key (path) in the bucket
                        type: string
                      region:
                        description: Region is the AWS region
                        type: string
                    required:
                    - bucket
                    - key
                    - region
                    type: object
                  type:
                    description: Type specifies the source type
                    enum:
                    - Git
                    - S3
                    - OCI
                    - Local
                    type: string
                required:
                - type
                type: object
            required:
            - action
            - serviceAccountName
            - source
            type: object
