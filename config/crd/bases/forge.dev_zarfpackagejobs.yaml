kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: zarfpackagejobs.forge.dev
spec:
  group: forge.dev
  names:
    kind: ZarfPackageJob
    listKind: ZarfPackageJobList
    plural: zarfpackagejobs
    shortNames:
    - zpj
    singular: zarfpackagejob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.action
