                type: string
              message:
                description: Message provides human-readable status information
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation observed by the
                  controller
                format: int64
                type: integer
              phase:
                description: Phase represents the current phase of the operation
                type: string
              publishStatus:
                description: PublishStatus contains publish operation status
                properties:
                  artifactLocation:
                    description: ArtifactLocation where the artifact was stored (for
                      build/publish)
                    type: string
                  completionTime:
                    description: CompletionTime when the operation completed
                    format: date-time
                    type: string
                  lastFailureReason:
                    description: LastFailureReason from most recent failure
                    type: string
                  message:
                    description: Message provides details about the operation
                    type: string
                  nextRetryTime:
                    description: NextRetryTime when next retry will be attempted
                    format: date-time
                    type: string
                  retryCount:
                    description: RetryCount tracks number of retry attempts
                    format: int32
