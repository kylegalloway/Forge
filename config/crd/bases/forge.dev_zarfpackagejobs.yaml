                        type: boolean
                    type: object
                  retry:
                    description: Retry policy for deploy failures
                    properties:
                      backoffMultiplier:
                        default: 2
                        description: BackoffMultiplier for exponential backoff
                        type: number
                      initialBackoff:
                        default: 30s
                        description: InitialBackoff is the delay before first retry
