apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scriptrunners.scriptrunner.io
spec:
  group: scriptrunner.io
  names:
    kind: ScriptRunner
    listKind: ScriptRunnerList
    plural: scriptrunners
    singular: scriptrunner
    shortNames:
    - sr
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              inputs:
                type: object
                additionalProperties:
                  type: string
                description: Key-value pairs passed as environment variables to the script
              image:
                type: string
                description: Container image to use for the job (defaults to busybox:latest)
              script:
                type: string
                description: Inline shell script to execute (mutually exclusive with scriptRef)
              scriptRef:
                type: string
                description: Path to a pre-built script in the container image (mutually exclusive with script)
              scriptArgs:
                type: array
                items:
                  type: string
                description: Arguments to pass to the script when using scriptRef
          status:
            type: object
            properties:
              phase:
                type: string
                description: Current phase of the ScriptRunner
              jobName:
                type: string
                description: Name of the created Job
              message:
                type: string
                description: Additional information about the current state
              lastUpdateTime:
                type: string
                format: date-time
                description: Last time the status was updated
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Job
      type: string
      jsonPath: .status.jobName
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
