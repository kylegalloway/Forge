apiVersion: v1
kind: Namespace
metadata:
  name: scriptrunner-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scriptrunner-controller
  namespace: scriptrunner-system
  labels:
    app: scriptrunner-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scriptrunner-controller
  template:
    metadata:
      labels:
        app: scriptrunner-controller
    spec:
      serviceAccountName: scriptrunner-controller
      containers:
      - name: controller
        image: scriptrunner-controller:latest
        imagePullPolicy: IfNotPresent
        command:
        - /controller
        args:
        - -v=2
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      terminationGracePeriodSeconds: 10
