---
# Namespace-Scoped Forge Deployment
# Watches only the forge-system namespace
apiVersion: v1
kind: Namespace
metadata:
  name: forge-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-controller
  namespace: forge-system
  labels:
    app: forge-controller
    app.kubernetes.io/name: forge-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: forge
spec:
  replicas: 1  # Single replica for namespace-scoped (can enable HA if needed)
  selector:
    matchLabels:
      app: forge-controller
  template:
    metadata:
      labels:
        app: forge-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: forge-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: forge-controller:latest
        imagePullPolicy: IfNotPresent
        command:
        - /controller
        args:
        - -v=2
        - --namespace=forge-system  # IMPORTANT: Watch only this namespace
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
      terminationGracePeriodSeconds: 10
---
# Service for metrics and health
apiVersion: v1
kind: Service
metadata:
  name: forge-controller
  namespace: forge-system
  labels:
    app: forge-controller
spec:
  selector:
    app: forge-controller
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
  - name: health
    port: 8081
    targetPort: health
  type: ClusterIP
