---
# Notes:
#
# 1. Default Behavior:
#    - With these policies, job pods can:
#      - Query DNS (kube-system/kube-dns)
#      - Access Kubernetes API (default namespace, ports 443/6443)
#      - NO access to other pods, services, or external IPs
#
# 2. Customization:
#    - Uncomment example policies above to allow specific traffic
#    - Add new NetworkPolicy resources for your specific requirements
#    - Use namespaceSelector + podSelector for service-to-service access
#    - Use ipBlock for external IPs (databases, APIs, etc.)
#
# 3. Testing:
#    - Deploy a test job pod: kubectl run test --image=alpine -n user-{{ .Username }}
#    - Test DNS: kubectl exec -n user-{{ .Username }} test -- nslookup kubernetes
#    - Test blocked traffic: kubectl exec -n user-{{ .Username }} test -- wget https://google.com
#      (Should fail if external HTTPS is not allowed)
#
# 4. Troubleshooting:
#    - View policies: kubectl get networkpolicy -n user-{{ .Username }}
#    - Describe policy: kubectl describe networkpolicy <name> -n user-{{ .Username }}
#    - Check CNI: kubectl get pods -n kube-system | grep -E 'calico|cilium|weave'
#    - Test connectivity: kubectl run test --rm -it --image=alpine -n user-{{ .Username }} -- sh
#
# 5. Security Considerations:
#    - These policies use podSelector: {} to apply to ALL pods
#    - Consider using more specific selectors (app: forge) if needed
#    - Block cloud metadata services (169.254.169.254) to prevent credential leaks
#    - Review and approve all NetworkPolicy changes in production
#    - Network policies are additive - multiple policies are OR'd together
