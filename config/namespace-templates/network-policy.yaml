# Network Policy Template for ZarfPackageJob Multi-Tenancy
#
# This template creates NetworkPolicies to restrict network access for job pods.
# By default, Kubernetes allows all traffic - these policies implement deny-by-default.
#
# Requirements:
# - CNI plugin with NetworkPolicy support (Calico, Cilium, Weave, etc.)
# - NOT supported by: Flannel (without additional components)
#
# Usage:
#   Replace {{ .Username }} with the actual username
#   kubectl apply -f network-policy.yaml
#
# Or use the onboarding script:
#   ./scripts/onboard-user.sh <username>

---
# Default Deny All Ingress
# Job pods should not receive any incoming connections
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: user-{{ .Username }}
  labels:
    forge.forge.dev/tenant: "{{ .Username }}"
    forge.forge.dev/network-policy: "default-deny"
spec:
  podSelector: {}  # Applies to all pods in namespace
  policyTypes:
  - Ingress
  # No ingress rules = deny all ingress

---
# Allow Egress to DNS
# Job pods need DNS to resolve service names
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: user-{{ .Username }}
  labels:
    forge.forge.dev/tenant: "{{ .Username }}"
    forge.forge.dev/network-policy: "dns"
spec:
  podSelector: {}  # Applies to all pods in namespace
  policyTypes:
  - Egress
  egress:
  # Allow DNS queries to kube-dns/CoreDNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# Allow Egress to Kubernetes API
# Job pods may need to read their own status or update ZarfPackageJob status
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubernetes-api
  namespace: user-{{ .Username }}
  labels:
    forge.forge.dev/tenant: "{{ .Username }}"
    forge.forge.dev/network-policy: "api-access"
spec:
  podSelector: {}  # Applies to all pods in namespace
  policyTypes:
  - Egress
  egress:
  # Allow HTTPS to Kubernetes API server
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443

