#   apiGroup: rbac.authorization.k8s.io
#   kind: Role
#   name: forge-user
# subjects:
# - kind: ServiceAccount
#   name: {{ .Username }}-automation
#   namespace: user-{{ .Username }}

---
# ClusterRole: Prevent privilege escalation
# This ClusterRole explicitly denies access to sensitive resources
# NOTE: Kubernetes RBAC is additive, so this only documents what users CANNOT do
# Actual enforcement relies on NOT granting these permissions in the first place
#
# Users CANNOT:
# - Modify CRDs (zarfpackages.forge.zarf.dev)
# - Access controller namespace (forge-system)
# - Create/modify ClusterRoles or ClusterRoleBindings
# - Create/modify Roles or RoleBindings outside their namespace
# - Access other user namespaces
# - Modify admission webhooks
# - Access secrets in other namespaces

# No ClusterRole is granted to users - they only have Role permissions in their namespace
# This ensures:
# - Users cannot escalate privileges (B2.16)
# - Users cannot modify controller or CRD (B2.17)
# - Users can only access their namespace (B2.15)
