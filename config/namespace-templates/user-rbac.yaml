# User RBAC Template for ZarfPackage Multi-Tenancy
#
# This template creates RBAC roles and bindings for ZarfPackage users.
# Users get scoped permissions within their own namespace:
# - Create/read/update/delete ZarfPackages
# - Read Jobs and Pods (for monitoring execution)
# - Cannot modify the controller, CRD, or cluster-wide resources
#
# Usage:
#   Replace {{ .Username }} with the actual username
#   kubectl apply -f user-rbac.yaml
#
# Or use the onboarding script:
#   ./scripts/onboard-user.sh <username>

---
# Role: ZarfPackage Creator
# Allows users to manage ZarfPackage resources in their namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forge-user
  namespace: user-{{ .Username }}
  labels:
    forge.zarf.dev/tenant: "{{ .Username }}"
    forge.zarf.dev/rbac: "user"
rules:
# Full access to ZarfPackage resources
- apiGroups:
  - forge.zarf.dev
  resources:
  - zarfpackages
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete

# Read-only access to ZarfPackage status
- apiGroups:
  - forge.zarf.dev
  resources:
  - zarfpackages/status
  verbs:
  - get
  - list
  - watch

# Read-only access to Jobs (created by controller)
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch

# Read-only access to Job status
- apiGroups:
  - batch
  resources:
  - jobs/status
  verbs:
  - get
  - list
  - watch

# Read-only access to Pods (for debugging)
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch

# Read-only access to Pod logs (for debugging)
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
  - list

# Read events (for debugging)
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - get
  - list
  - watch

---
# RoleBinding: Bind the user to the forge-user role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Username }}-forge-user
  namespace: user-{{ .Username }}
  labels:
    forge.zarf.dev/tenant: "{{ .Username }}"
    forge.zarf.dev/rbac: "user"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forge-user
subjects:
- kind: User
  name: {{ .Username }}
  apiGroup: rbac.authorization.k8s.io

---
# Optional: ServiceAccount for CI/CD or automation
# Uncomment to create a ServiceAccount with the same permissions
#
# apiVersion: v1
# kind: ServiceAccount
# metadata:
#   name: {{ .Username }}-automation
#   namespace: user-{{ .Username }}
#   labels:
#     forge.zarf.dev/tenant: "{{ .Username }}"
#     forge.zarf.dev/rbac: "automation"
