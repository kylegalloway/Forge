# Network Policy for Forge Controller
#
# This policy restricts network access for the controller deployment.
# The controller only needs to communicate with the Kubernetes API server.
#
# Requirements:
# - CNI plugin with NetworkPolicy support (Calico, Cilium, Weave, etc.)
#
# Usage:
#   kubectl apply -f controller-network-policy.yaml

---
# Default Deny All Ingress for Controller Namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}  # Applies to all pods in forge-system
  policyTypes:
  - Ingress
  # No ingress rules = deny all ingress

---
# Allow Controller Egress to Kubernetes API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-allow-api
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge-controller
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: forge-controller
  policyTypes:
  - Egress
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

  # Allow Kubernetes API
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443

---
# Allow Webhook Ingress from Kubernetes API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-allow-api-ingress
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge-webhook
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: forge-webhook
  policyTypes:
  - Ingress
  ingress:
  # Allow HTTPS from Kubernetes API server
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    - podSelector:
        matchLabels:
          component: apiserver
    ports:
    - protocol: TCP
      port: 8443

---
# Allow Webhook Egress to Kubernetes API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-allow-api-egress
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge-webhook
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: forge-webhook
  policyTypes:
  - Egress
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

  # Allow Kubernetes API
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443

---
# Notes:
#
# 1. Controller Network Requirements:
#    - Egress to Kubernetes API (watch ZarfPackageJobs, create Jobs)
#    - Egress to DNS (resolve service names)
#    - NO ingress required (controller initiates all connections)
#
# 2. Webhook Network Requirements:
#    - Ingress from Kubernetes API server on port 8443 (admission requests)
#    - Egress to Kubernetes API (validate ZarfPackageJobs)
#    - Egress to DNS (resolve service names)
#
# 3. Testing:
#    - Verify controller can watch ZarfPackageJobs:
#      kubectl logs -n forge-system deployment/forge-controller
#    - Verify controller can create Jobs:
#      kubectl apply -f config/samples/forge_v1alpha1_forge.yaml
#    - Verify webhook receives admission requests:
#      kubectl logs -n forge-system deployment/forge-webhook
#
# 4. Troubleshooting:
#    - If controller can't create Jobs: Check egress to API server
#    - If webhook denies all requests: Check ingress from API server
#    - View policies: kubectl get networkpolicy -n forge-system
#    - Describe policies: kubectl describe networkpolicy -n forge-system
#
# 5. Security Considerations:
#    - Controller has no ingress (defense-in-depth)
#    - Webhook only accepts traffic from API server
#    - No egress to external networks
#    - DNS limited to kube-system namespace
