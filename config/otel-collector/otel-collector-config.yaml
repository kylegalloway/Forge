# OpenTelemetry Collector Configuration for Forge
# This collector receives telemetry from the controller and exports to multiple backends

apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: forge-system
  labels:
    app: otel-collector
data:
  otel-collector-config.yaml: |
    # Receivers: How telemetry enters the collector
    receivers:
      # OTLP receiver for gRPC (controller sends here)
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # Prometheus receiver to scrape controller metrics
      # This is a fallback if you're using the Prometheus exporter bridge
      prometheus:
        config:
          scrape_configs:
            - job_name: 'forge-controller'
              scrape_interval: 15s
              static_configs:
                - targets: ['forge-controller-metrics:8080']
                  labels:
                    service: 'forge-controller'

    # Processors: Transform and filter telemetry
    processors:
      # Batch processor reduces load on exporters
      batch:
        timeout: 10s
        send_batch_size: 1024

      # Memory limiter prevents OOM
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

      # Resource processor adds common attributes
      resource:
        attributes:
          - key: service.name
            value: forge-controller
            action: upsert
          - key: service.namespace
            value: forge-system
            action: upsert
          - key: deployment.environment
            value: production
            action: upsert

      # Attributes processor for filtering/transforming
      attributes:
        actions:
          - key: k8s.namespace.name
            from_attribute: namespace
            action: upsert
          - key: k8s.pod.name
            from_attribute: pod
            action: upsert

    # Exporters: Where telemetry goes
    exporters:
      # Prometheus exporter (exposes metrics for Prometheus to scrape)
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: forge
        const_labels:
          service: forge-controller

      # Jaeger exporter for traces
      otlp/jaeger:
        endpoint: jaeger-collector:4317
        tls:
          insecure: true

      # Prometheus remote write (if using Prometheus with remote storage)
      prometheusremotewrite:
        endpoint: "http://prometheus-server:9090/api/v1/write"
        tls:
          insecure: true

      # Logging exporter for debugging
      logging:
        loglevel: info
        sampling_initial: 5
        sampling_thereafter: 200

      # OTLP exporter for forwarding to other collectors or backends
      # Uncomment and configure for your backend:

      # # Datadog
      # otlp/datadog:
      #   endpoint: https://api.datadoghq.com
      #   headers:
      #     DD-API-KEY: ${DD_API_KEY}

      # # New Relic
      # otlp/newrelic:
      #   endpoint: https://otlp.nr-data.net:4317
      #   headers:
      #     api-key: ${NEW_RELIC_LICENSE_KEY}

      # # Honeycomb
      # otlp/honeycomb:
      #   endpoint: api.honeycomb.io:443
      #   headers:
      #     x-honeycomb-team: ${HONEYCOMB_API_KEY}

    # Extensions: Health checks and monitoring
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679

    # Service: Pipeline configuration
    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        # Traces pipeline
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, attributes, batch]
          exporters: [logging, otlp/jaeger]

        # Metrics pipeline
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, resource, batch]
          exporters: [logging, prometheus, prometheusremotewrite]

        # Logs pipeline (if we add log collection later)
        # logs:
        #   receivers: [otlp]
        #   processors: [memory_limiter, resource, batch]
        #   exporters: [logging]
