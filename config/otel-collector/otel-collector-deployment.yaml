---
# OpenTelemetry Collector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: forge-system
  labels:
    app: otel-collector
    component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        component: observability
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: otel-collector
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.110.0
        args:
          - --config=/conf/otel-collector-config.yaml
        ports:
        # OTLP gRPC receiver
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        # OTLP HTTP receiver
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        # Prometheus exporter
        - name: prometheus
          containerPort: 8889
          protocol: TCP
        # Health check
        - name: health
          containerPort: 13133
          protocol: TCP
        # pprof
        - name: pprof
          containerPort: 1777
          protocol: TCP
        # zpages
        - name: zpages
          containerPort: 55679
          protocol: TCP
        volumeMounts:
        - name: otel-collector-config
          mountPath: /conf
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
      volumes:
      - name: otel-collector-config
        configMap:
          name: otel-collector-config
          items:
            - key: otel-collector-config.yaml
              path: otel-collector-config.yaml
---
# Service for OTel Collector
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: forge-system
  labels:
    app: otel-collector
    component: observability
spec:
  type: ClusterIP
  ports:
  # OTLP gRPC (controller sends here)
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
    protocol: TCP
  # OTLP HTTP
  - name: otlp-http
    port: 4318
    targetPort: 4318
    protocol: TCP
  # Prometheus metrics
  - name: prometheus
    port: 8889
    targetPort: 8889
    protocol: TCP
  # Health check
  - name: health
    port: 13133
    targetPort: 13133
    protocol: TCP
  selector:
    app: otel-collector
---
# ServiceAccount for OTel Collector
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: forge-system
  labels:
    app: otel-collector
---
# ClusterRole for OTel Collector (if scraping k8s metrics)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
  labels:
    app: otel-collector
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
- nonResourceURLs:
  - /metrics
  verbs: ["get"]
---
# ClusterRoleBinding for OTel Collector
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
  labels:
    app: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
- kind: ServiceAccount
  name: otel-collector
  namespace: forge-system
---
# ServiceMonitor for Prometheus to scrape OTel Collector metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: forge-system
  labels:
    app: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  endpoints:
  - port: prometheus
    interval: 30s
    path: /metrics
