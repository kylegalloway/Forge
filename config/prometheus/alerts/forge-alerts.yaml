apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forge-alerts
  namespace: forge-system
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: forge.controller
    interval: 30s
    rules:
    # Controller Health
    - alert: ZarfPackageJobControllerDown
      expr: up{job="forge-controller-metrics"} == 0
      for: 5m
      labels:
        severity: critical
        component: controller
      annotations:
        summary: "ZarfPackageJob controller is down"
        description: "ZarfPackageJob controller has been down for more than 5 minutes. No ZarfPackageJob resources will be reconciled."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#forgecontrollerdown"

    # High Error Rate
    - alert: ZarfPackageJobHighErrorRate
      expr: |
        (
          sum(rate(forge_reconcile_errors_total[5m]))
          /
          sum(rate(forge_resources_created_total[5m]))
        ) > 0.10
      for: 10m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "High error rate in ZarfPackageJob reconciliation"
        description: "More than 10% of ZarfPackageJob reconciliations are failing (current: {{ $value | humanizePercentage }})"
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#high-error-rate"

    - alert: ZarfPackageJobCriticalErrorRate
      expr: |
        (
          sum(rate(forge_reconcile_errors_total[5m]))
          /
          sum(rate(forge_resources_created_total[5m]))
        ) > 0.50
      for: 5m
      labels:
        severity: critical
        component: controller
      annotations:
        summary: "Critical error rate in ZarfPackageJob reconciliation"
        description: "More than 50% of ZarfPackageJob reconciliations are failing (current: {{ $value | humanizePercentage }}). Controller may be broken."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#critical-error-rate"

    # Slow Reconciliation
    - alert: ZarfPackageJobSlowReconciliation
      expr: |
        histogram_quantile(0.95,
          sum(rate(forge_reconcile_duration_seconds_bucket[5m])) by (le)
        ) > 5
      for: 15m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "ZarfPackageJob reconciliation is slow"
        description: "p95 reconciliation latency is {{ $value | humanizeDuration }} (threshold: 5s). Controller may be overloaded."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#slow-reconciliation"

    # Job Creation Failures
    - alert: ZarfPackageJobCreationFailures
      expr: sum(rate(forge_reconcile_errors_total{error_type="job_creation_error"}[5m])) > 0.1
      for: 10m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "Frequent Job creation failures"
        description: "Job creation is failing at {{ $value }} per second. May indicate API server issues or RBAC problems."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#job-creation-failures"

    # No Activity (Controller may be stuck)
    - alert: ZarfPackageJobNoActivity
      expr: |
        rate(forge_resources_created_total[10m]) == 0
        and
        forge_resources_active > 0
      for: 30m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "No ZarfPackageJob activity detected"
        description: "Controller has {{ $value }} active ZarfPackageJobs but hasn't created any new ones in 30 minutes. May be stuck."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#no-activity"

  - name: forge.webhook
    interval: 30s
    rules:
    # Webhook Validation Failures
    - alert: ZarfPackageJobWebhookHighRejectionRate
      expr: sum(rate(forge_webhook_validation_errors_total[5m])) > 1
      for: 10m
      labels:
        severity: info
        component: webhook
      annotations:
        summary: "High rate of webhook validation rejections"
        description: "Webhook is rejecting {{ $value }} ZarfPackageJob creates per second. Users may be submitting invalid resources."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#webhook-rejections"

    # Webhook Down
    - alert: ZarfPackageJobWebhookDown
      expr: up{job="forge-webhook-metrics"} == 0
      for: 5m
      labels:
        severity: warning
        component: webhook
      annotations:
        summary: "ZarfPackageJob webhook is down"
        description: "Admission webhook has been down for 5 minutes. New ZarfPackageJob resources cannot be validated."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#webhook-down"

  - name: forge.capacity
    interval: 60s
    rules:
    # High Resource Usage
    - alert: ZarfPackageJobHighResourceCount
      expr: forge_resources_active > 1000
      for: 10m
      labels:
        severity: info
        component: controller
      annotations:
        summary: "High number of active ZarfPackageJobs"
        description: "Cluster has {{ $value }} active ZarfPackageJobs. May need to scale controller or review capacity."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#high-resource-count"

    - alert: ZarfPackageJobVeryHighResourceCount
      expr: forge_resources_active > 5000
      for: 10m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "Very high number of active ZarfPackageJobs"
        description: "Cluster has {{ $value }} active ZarfPackageJobs. Controller may struggle at this scale."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#very-high-resource-count"
