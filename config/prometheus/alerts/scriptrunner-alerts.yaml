apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scriptrunner-alerts
  namespace: forge-system
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: scriptrunner.controller
    interval: 30s
    rules:
    # Controller Health
    - alert: ScriptRunnerControllerDown
      expr: up{job="forge-controller-metrics"} == 0
      for: 5m
      labels:
        severity: critical
        component: controller
      annotations:
        summary: "ScriptRunner controller is down"
        description: "ScriptRunner controller has been down for more than 5 minutes. No ScriptRunner resources will be reconciled."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#scriptrunnercontrollerdown"

    # High Error Rate
    - alert: ScriptRunnerHighErrorRate
      expr: |
        (
          sum(rate(scriptrunner_reconcile_errors_total[5m]))
          /
          sum(rate(scriptrunner_resources_created_total[5m]))
        ) > 0.10
      for: 10m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "High error rate in ScriptRunner reconciliation"
        description: "More than 10% of ScriptRunner reconciliations are failing (current: {{ $value | humanizePercentage }})"
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#high-error-rate"

    - alert: ScriptRunnerCriticalErrorRate
      expr: |
        (
          sum(rate(scriptrunner_reconcile_errors_total[5m]))
          /
          sum(rate(scriptrunner_resources_created_total[5m]))
        ) > 0.50
      for: 5m
      labels:
        severity: critical
        component: controller
      annotations:
        summary: "Critical error rate in ScriptRunner reconciliation"
        description: "More than 50% of ScriptRunner reconciliations are failing (current: {{ $value | humanizePercentage }}). Controller may be broken."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#critical-error-rate"

    # Slow Reconciliation
    - alert: ScriptRunnerSlowReconciliation
      expr: |
        histogram_quantile(0.95,
          sum(rate(scriptrunner_reconcile_duration_seconds_bucket[5m])) by (le)
        ) > 5
      for: 15m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "ScriptRunner reconciliation is slow"
        description: "p95 reconciliation latency is {{ $value | humanizeDuration }} (threshold: 5s). Controller may be overloaded."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#slow-reconciliation"

    # Job Creation Failures
    - alert: ScriptRunnerJobCreationFailures
      expr: sum(rate(scriptrunner_reconcile_errors_total{error_type="job_creation_error"}[5m])) > 0.1
      for: 10m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "Frequent Job creation failures"
        description: "Job creation is failing at {{ $value }} per second. May indicate API server issues or RBAC problems."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#job-creation-failures"

    # No Activity (Controller may be stuck)
    - alert: ScriptRunnerNoActivity
      expr: |
        rate(scriptrunner_resources_created_total[10m]) == 0
        and
        scriptrunner_resources_active > 0
      for: 30m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "No ScriptRunner activity detected"
        description: "Controller has {{ $value }} active ScriptRunners but hasn't created any new ones in 30 minutes. May be stuck."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#no-activity"

  - name: scriptrunner.webhook
    interval: 30s
    rules:
    # Webhook Validation Failures
    - alert: ScriptRunnerWebhookHighRejectionRate
      expr: sum(rate(scriptrunner_webhook_validation_errors_total[5m])) > 1
      for: 10m
      labels:
        severity: info
        component: webhook
      annotations:
        summary: "High rate of webhook validation rejections"
        description: "Webhook is rejecting {{ $value }} ScriptRunner creates per second. Users may be submitting invalid resources."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#webhook-rejections"

    # Webhook Down
    - alert: ScriptRunnerWebhookDown
      expr: up{job="scriptrunner-webhook-metrics"} == 0
      for: 5m
      labels:
        severity: warning
        component: webhook
      annotations:
        summary: "ScriptRunner webhook is down"
        description: "Admission webhook has been down for 5 minutes. New ScriptRunner resources cannot be validated."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#webhook-down"

  - name: scriptrunner.capacity
    interval: 60s
    rules:
    # High Resource Usage
    - alert: ScriptRunnerHighResourceCount
      expr: scriptrunner_resources_active > 1000
      for: 10m
      labels:
        severity: info
        component: controller
      annotations:
        summary: "High number of active ScriptRunners"
        description: "Cluster has {{ $value }} active ScriptRunners. May need to scale controller or review capacity."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#high-resource-count"

    - alert: ScriptRunnerVeryHighResourceCount
      expr: scriptrunner_resources_active > 5000
      for: 10m
      labels:
        severity: warning
        component: controller
      annotations:
        summary: "Very high number of active ScriptRunners"
        description: "Cluster has {{ $value }} active ScriptRunners. Controller may struggle at this scale."
        runbook_url: "https://github.com/kylegalloway/forge/blob/main/config/prometheus/alerts/README.md#very-high-resource-count"
