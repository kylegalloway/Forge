apiVersion: v1
kind: ServiceAccount
metadata:
  name: scriptrunner-controller
  namespace: scriptrunner-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scriptrunner-controller-role
rules:
# Permissions for ScriptRunner resources
- apiGroups:
  - scriptrunner.io
  resources:
  - scriptrunners
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - scriptrunner.io
  resources:
  - scriptrunners/status
  verbs:
  - get
  - update
  - patch
# Permissions for Jobs
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete
# Permissions for Pods (to check job status if needed)
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scriptrunner-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scriptrunner-controller-role
subjects:
- kind: ServiceAccount
  name: scriptrunner-controller
  namespace: scriptrunner-system
