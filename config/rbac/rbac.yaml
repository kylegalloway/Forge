apiVersion: v1
kind: ServiceAccount
metadata:
  name: forge-controller
  namespace: forge-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forge-controller-role
rules:
# Permissions for ScriptRunner resources - read only
- apiGroups:
  - scriptrunner.io
  resources:
  - scriptrunners
  verbs:
  - get
  - list
  - watch
# Permissions to update ScriptRunner status
- apiGroups:
  - scriptrunner.io
  resources:
  - scriptrunners/status
  verbs:
  - get
  - update
  - patch
# Permissions for Jobs - create and read only (cleanup handled by TTL and owner references)
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
# Permissions for Pods - read only (for debugging/status checking)
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
# Permissions for Events - create for better observability
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forge-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forge-controller-role
subjects:
- kind: ServiceAccount
  name: forge-controller
  namespace: forge-system
