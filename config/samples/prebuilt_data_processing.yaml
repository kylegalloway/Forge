apiVersion: scriptrunner.io/v1alpha1
kind: ScriptRunner
metadata:
  name: scriptref-data-processing
  namespace: default
spec:
  # Use a custom image with pre-built scripts
  image: scriptrunner-scripts:latest

  # Reference a pre-built script in the container
  scriptRef: /scripts/process-data.sh

  # Pass arguments to the script
  scriptArgs:
    - "batch-process"  # operation type
    - "15"             # number of items to process

  # Input variables are still available as environment variables
  inputs:
    environment: "production"
    source: "database"
    batch_id: "12345"
