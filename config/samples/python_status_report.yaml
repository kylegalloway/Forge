apiVersion: scriptrunner.io/v1alpha1
kind: ScriptRunner
metadata:
  name: scriptref-python-report
  namespace: default
spec:
  # Use a custom image with Python script
  image: scriptrunner-scripts:latest

  # Reference the Python script
  scriptRef: /scripts/report-status.py

  # Pass format argument
  scriptArgs:
    - "json"

  # Inputs for the report
  inputs:
    service: "api-gateway"
    region: "us-west-2"
    status: "healthy"
    uptime: "99.9"
