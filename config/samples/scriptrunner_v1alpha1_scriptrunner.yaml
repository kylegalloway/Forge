apiVersion: scriptrunner.io/v1alpha1
kind: ScriptRunner
metadata:
  name: example-scriptrunner
  namespace: default
spec:
  # Inputs are passed as environment variables with INPUT_ prefix
  inputs:
    message: "Hello from ScriptRunner!"
    environment: "production"
    value: "42"
  # Optional: Override the default image
  # image: "busybox:latest"
  # Optional: Override the default script
  # script: |
  #   #!/bin/sh
  #   echo "Custom script running..."
  #   echo "Message: $INPUT_message"
  #   echo "Environment: $INPUT_environment"
