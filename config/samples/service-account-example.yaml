---
# Example ServiceAccount with Forge permissions
# Created by cluster admin to grant teams access to Forge operations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer-forge-sa
  namespace: default
  annotations:
    # What actions this SA can perform
    forge.zarf.dev/allowed-actions: "Build,Publish"

    # Which Git repos can be used as sources (glob patterns)
    forge.zarf.dev/allowed-source-repos: "github.com/myorg/*,github.com/defenseunicorns/zarf"

    # Which OCI registries can be used for publishing (glob patterns)
    forge.zarf.dev/allowed-publish-registries: "ghcr.io/myorg/*"

    # Which S3 buckets can be used for publishing (glob patterns)
    forge.zarf.dev/allowed-publish-buckets: "my-artifacts-*"

    # Which deploy targets are allowed
    forge.zarf.dev/allowed-deploy-targets: "InCluster"

---
# Example: Production ServiceAccount with restricted permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-forge-sa
  namespace: production
  annotations:
    # Production can only deploy pre-built packages
    forge.zarf.dev/allowed-actions: "Deploy"

    # Can only pull from approved registries
    forge.zarf.dev/allowed-source-registries: "ghcr.io/myorg/prod/*"

    # Can only deploy to external clusters (not in-cluster)
    forge.zarf.dev/allowed-deploy-targets: "ExternalCluster"

---
# Example: Platform team ServiceAccount with full permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-team-forge-sa
  namespace: platform-team
  annotations:
    # Platform team can do everything
    forge.zarf.dev/allowed-actions: "Build,Publish,Deploy,BuildPublish,BuildDeploy,PublishDeploy,BuildPublishDeploy"

    # Can use any source
    forge.zarf.dev/allowed-source-repos: "*"
    forge.zarf.dev/allowed-source-buckets: "*"
    forge.zarf.dev/allowed-source-registries: "*"

    # Can publish anywhere
    forge.zarf.dev/allowed-publish-buckets: "*"
    forge.zarf.dev/allowed-publish-registries: "*"

    # Can deploy anywhere
    forge.zarf.dev/allowed-deploy-targets: "InCluster,ExternalCluster"
