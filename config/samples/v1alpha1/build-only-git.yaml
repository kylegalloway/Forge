---
# Example: Build a Zarf package from Git (no publish or deploy)
apiVersion: forge.dev/v1alpha1
kind: ZarfPackageJob
metadata:
  name: build-only-example
  namespace: default
spec:
  # ServiceAccount controls what this package is allowed to do
  # Created by cluster admin with forge.forge.dev/* annotations
  serviceAccountName: developer-forge-sa

  action: Build

  source:
    type: Git
    git:
      url: https://github.com/myorg/my-package
      ref: main
      path: .
      credentialsSecretRef:
        name: github-token

  # No publish or deploy config needed
  # Built artifact will be stored in job pod (for local testing)
