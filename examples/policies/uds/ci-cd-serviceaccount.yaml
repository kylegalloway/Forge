apiVersion: v1
kind: ServiceAccount
metadata:
  name: uds-bundle-cicd
  namespace: forge-system
  annotations:
    # CI/CD pipeline: create and publish bundles, but no deployment
    forge.dev/allowed-actions: "Create,Publish"

    # Allow company internal source repositories only
    forge.dev/allowed-source-repos: "github.com/myorg/*,gitlab.mycompany.com/*"

    # Allow pulling from company OCI registry
    forge.dev/allowed-source-registries: "registry.mycompany.com/*"

    # Allow publishing to company OCI registry
    forge.dev/allowed-publish-registries: "registry.mycompany.com/*"

    # No deployment permissions (handled by separate deploy pipeline)
    # forge.dev/allowed-deploy-targets: ""

    # Allow publishing to company S3 buckets
    forge.dev/allowed-publish-buckets: "mycompany-uds-bundles,mycompany-uds-bundles-staging"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uds-bundle-cicd
  namespace: forge-system
rules:
  # Required: Create and manage Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]

  # Required: Access to Secrets for credentials (OCI, S3, Git)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # Required: Access to ConfigMaps for attestations
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uds-bundle-cicd
  namespace: forge-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uds-bundle-cicd
subjects:
  - kind: ServiceAccount
    name: uds-bundle-cicd
    namespace: forge-system

---
# Example Secret for OCI registry credentials
apiVersion: v1
kind: Secret
metadata:
  name: registry-mycompany-com
  namespace: forge-system
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded Docker config JSON
  # Generate with: kubectl create secret docker-registry registry-mycompany-com \
  #   --docker-server=registry.mycompany.com \
  #   --docker-username=robot-account \
  #   --docker-password=<token> \
  #   --dry-run=client -o yaml
  .dockerconfigjson: eyJhdXRocyI6eyJyZWdpc3RyeS5teWNvbXBhbnkuY29tIjp7InVzZXJuYW1lIjoicm9ib3QtYWNjb3VudCIsInBhc3N3b3JkIjoidG9rZW4iLCJhdXRoIjoiY205aWIzUXRZV05qYjNWdWREcDBiMnRsYmc9PSJ9fX0=

---
# Example Secret for S3 credentials
apiVersion: v1
kind: Secret
metadata:
  name: s3-mycompany-credentials
  namespace: forge-system
type: Opaque
stringData:
  access-key-id: AKIAIOSFODNN7EXAMPLE  # pragma: allowlist secret
  secret-access-key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY  # pragma: allowlist secret
  # Optional: session-token for temporary credentials
  # session-token: FwoGZXIvYXdzEEoaDH...  # pragma: allowlist secret

---
# Example Secret for Git credentials (SSH key)
apiVersion: v1
kind: Secret
metadata:
  name: git-ssh-key
  namespace: forge-system
type: Opaque
stringData:
  # SSH private key for Git access
  # Replace with your actual SSH private key content
  id_rsa: "<base64-encoded-ssh-private-key>"  # pragma: allowlist secret
  # SSH known_hosts to prevent MITM attacks
  known_hosts: |
    github.com ssh-rsa AAAAB3NzaC1yc2EAAAABIwAAAQEAq2A7hRGmdnm9tUDbO9...
    gitlab.mycompany.com ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC...
