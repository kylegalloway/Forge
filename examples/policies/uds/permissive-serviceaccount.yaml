apiVersion: v1
kind: ServiceAccount
metadata:
  name: uds-bundle-operator-permissive
  namespace: forge-system
  annotations:
    # Allow all UDS bundle actions
    forge.dev/allowed-actions: "Create,Publish,Deploy"

    # Allow all source repositories (use with caution in production)
    forge.dev/allowed-source-repos: "*"

    # Allow all source registries (use with caution in production)
    forge.dev/allowed-source-registries: "*"

    # Allow publishing to all registries (use with caution in production)
    forge.dev/allowed-publish-registries: "*"

    # Allow deployment to any target
    forge.dev/allowed-deploy-targets: "*"

    # Allow all source S3 buckets (use with caution in production)
    forge.dev/allowed-source-buckets: "*"

    # Allow publishing to all S3 buckets (use with caution in production)
    forge.dev/allowed-publish-buckets: "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uds-bundle-operator-permissive
  namespace: forge-system
rules:
  # Required: Create and manage Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]

  # Required: Access to Secrets for credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # Required: Access to ConfigMaps for attestations
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uds-bundle-operator-permissive
  namespace: forge-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uds-bundle-operator-permissive
subjects:
  - kind: ServiceAccount
    name: uds-bundle-operator-permissive
    namespace: forge-system

---
# If deploying to other namespaces, you need ClusterRole permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: uds-bundle-deployer-permissive
rules:
  # Required for UDS bundle deployment
  - apiGroups: [""]
    resources: ["namespaces", "services", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]

  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: uds-bundle-deployer-permissive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: uds-bundle-deployer-permissive
subjects:
  - kind: ServiceAccount
    name: uds-bundle-operator-permissive
    namespace: forge-system
