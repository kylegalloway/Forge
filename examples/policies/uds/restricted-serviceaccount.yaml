apiVersion: v1
kind: ServiceAccount
metadata:
  name: uds-bundle-operator-restricted
  namespace: forge-system
  annotations:
    # Only allow create and deploy (no publish to external registries)
    forge.dev/allowed-actions: "Create,Deploy"

    # Only allow specific approved source repositories
    forge.dev/allowed-source-repos: "github.com/cncf/*,github.com/myorg/*"

    # No OCI registry access (internal builds only)
    # forge.dev/allowed-source-registries: ""

    # Only allow deployment to specific targets
    forge.dev/allowed-deploy-targets: "uds-dev,uds-staging"

    # No S3 access (local builds only)
    # forge.dev/allowed-source-buckets: ""

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uds-bundle-operator-restricted
  namespace: forge-system
rules:
  # Required: Create and manage Jobs (read-only for security)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]

  # Required: Read-only access to Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # Required: ConfigMaps for attestations (minimal permissions)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uds-bundle-operator-restricted
  namespace: forge-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uds-bundle-operator-restricted
subjects:
  - kind: ServiceAccount
    name: uds-bundle-operator-restricted
    namespace: forge-system

---
# Restricted deployment permissions - only to specific namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uds-bundle-deployer-restricted
  namespace: uds-dev  # Repeat for each allowed namespace
rules:
  # Minimal deployment permissions
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["create", "get", "list", "update"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "update", "patch"]

  # Read-only for sensitive resources
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uds-bundle-deployer-restricted
  namespace: uds-dev  # Repeat for each allowed namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uds-bundle-deployer-restricted
subjects:
  - kind: ServiceAccount
    name: uds-bundle-operator-restricted
    namespace: forge-system

---
# Repeat for uds-staging namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uds-bundle-deployer-restricted
  namespace: uds-staging
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["create", "get", "list", "update"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "update", "patch"]

  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uds-bundle-deployer-restricted
  namespace: uds-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uds-bundle-deployer-restricted
subjects:
  - kind: ServiceAccount
    name: uds-bundle-operator-restricted
    namespace: forge-system
