# Forge ServiceAccount Policy Annotations Reference
# This file documents ALL available policy annotations for ServiceAccounts.
# These annotations control what ZarfPackageJob and UDSBundleJob resources
# are allowed to do when they reference this ServiceAccount.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forge-complete-reference
  namespace: forge-system
  annotations:
    # =========================================================================
    # ACTION PERMISSIONS
    # =========================================================================

    # forge.dev/allowed-actions
    # Controls which job actions are permitted
    # Comma-separated list of action names (case-sensitive, use PascalCase)
    #
    # Valid values for ZarfPackageJob:
    #   Build, Publish, Deploy, BuildPublish, BuildDeploy, PublishDeploy, BuildPublishDeploy
    #
    # Valid values for UDSBundleJob:
    #   Create, Publish, Deploy, CreatePublish, CreateDeploy, PublishDeploy, CreatePublishDeploy
    #
    # Special value: "*" allows all actions
    #
    # Examples:
    #   "Build,Publish"                    - Allow build and publish only
    #   "Build,Publish,BuildPublish"       - Allow build, publish, and combined
    #   "Create,Deploy,CreateDeploy"       - Allow create, deploy, and combined (UDS)
    #   "*"                                - Allow all actions
    forge.dev/allowed-actions: "Build,Publish,Deploy,BuildPublish,BuildDeploy,Create,CreatePublish,CreateDeploy"

    # =========================================================================
    # SOURCE PERMISSIONS
    # =========================================================================

    # forge.dev/allowed-source-repos
    # Controls which Git repositories can be used as sources
    # Comma-separated list of URL patterns (glob patterns supported)
    #
    # Pattern matching:
    #   * matches any sequence of characters within a path segment
    #   ** matches any sequence including path separators (not supported)
    #
    # Examples:
    #   "https://github.com/myorg/*"                 - Any repo in myorg
    #   "https://github.com/myorg/project-*"         - Repos starting with project-
    #   "https://gitlab.example.com/*"               - Any repo on private GitLab
    #   "https://github.com/*,https://gitlab.com/*"  - Multiple hosts
    #   "*"                                          - Allow any Git repository
    forge.dev/allowed-source-repos: "https://github.com/myorg/*,https://gitlab.example.com/*"

    # forge.dev/allowed-source-buckets
    # Controls which S3 buckets can be used as sources
    # Comma-separated list of bucket name patterns (glob patterns supported)
    #
    # Examples:
    #   "my-packages-*"                    - Buckets starting with my-packages-
    #   "prod-*,staging-*"                 - Prod or staging buckets
    #   "company-artifacts"                - Exact bucket name
    #   "*"                                - Allow any S3 bucket
    forge.dev/allowed-source-buckets: "myorg-packages-*,myorg-bundles-*"

    # forge.dev/allowed-source-registries
    # Controls which OCI registries can be used as sources
    # Comma-separated list of registry URL patterns (glob patterns supported)
    #
    # Examples:
    #   "ghcr.io/myorg/*"                  - Any repo in myorg on GHCR
    #   "registry.example.com/*"           - Any repo on private registry
    #   "docker.io/library/*"              - Official Docker images only
    #   "*"                                - Allow any OCI registry
    forge.dev/allowed-source-registries: "ghcr.io/myorg/*,registry.example.com/*"

    # =========================================================================
    # PUBLISH PERMISSIONS
    # =========================================================================

    # forge.dev/allowed-publish-buckets
    # Controls which S3 buckets can be used as publish destinations
    # Comma-separated list of bucket name patterns (glob patterns supported)
    #
    # Examples:
    #   "artifacts-prod"                   - Only production artifacts bucket
    #   "artifacts-*"                      - Any artifacts bucket
    #   "*"                                - Allow publishing to any bucket
    forge.dev/allowed-publish-buckets: "myorg-artifacts-*"

    # forge.dev/allowed-publish-registries
    # Controls which OCI registries can be used as publish destinations
    # Comma-separated list of registry URL patterns (glob patterns supported)
    #
    # Examples:
    #   "ghcr.io/myorg/*"                  - Publish to myorg repos on GHCR
    #   "registry.example.com/releases/*"  - Publish to releases path only
    #   "*"                                - Allow publishing to any registry
    forge.dev/allowed-publish-registries: "ghcr.io/myorg/*,registry.example.com/*"

    # =========================================================================
    # DEPLOY PERMISSIONS
    # =========================================================================

    # forge.dev/allowed-deploy-targets
    # Controls which deployment targets are permitted
    # Comma-separated list of target types (case-sensitive)
    #
    # Valid values:
    #   InCluster        - Deploy to the cluster where Forge runs
    #   ExternalCluster  - Deploy to a remote cluster via kubeconfig
    #   *                - Allow both targets
    #
    # Examples:
    #   "InCluster"                        - Local cluster only
    #   "ExternalCluster"                  - Remote clusters only
    #   "InCluster,ExternalCluster"        - Both allowed
    #   "*"                                - Allow all targets
    forge.dev/allowed-deploy-targets: "InCluster,ExternalCluster"

    # =========================================================================
    # DEVELOPMENT MODE
    # =========================================================================

    # forge.dev/allow-local-sources
    # Controls whether local filesystem sources are permitted
    # This is for development/testing only - not recommended for production
    #
    # Valid values:
    #   "true"   - Allow local sources (requires devMode: true in job spec)
    #   "false"  - Deny local sources (default if annotation absent)
    forge.dev/allow-local-sources: "false"

---
# =============================================================================
# EXAMPLE: CI/CD Pipeline ServiceAccount (Build and Publish only)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-builder
  namespace: forge-system
  annotations:
    # Only allow build and publish actions
    forge.dev/allowed-actions: "Build,Publish,BuildPublish,Create,CreatePublish"
    # Restrict to company repositories
    forge.dev/allowed-source-repos: "https://github.com/mycompany/*"
    # Allow publishing to company registry
    forge.dev/allowed-publish-registries: "ghcr.io/mycompany/*"
    # No deployment permissions
    # forge.dev/allowed-deploy-targets: ""  # Absent = no deploy allowed

---
# =============================================================================
# EXAMPLE: Production Deployer ServiceAccount (Deploy only)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: production-deployer
  namespace: forge-system
  annotations:
    # Only allow deploy action
    forge.dev/allowed-actions: "Deploy"
    # Only allow pulling from company registry
    forge.dev/allowed-source-registries: "ghcr.io/mycompany/releases/*"
    # Only allow in-cluster deployment
    forge.dev/allowed-deploy-targets: "InCluster"

---
# =============================================================================
# EXAMPLE: Platform Team ServiceAccount (Full permissions)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-team
  namespace: forge-system
  annotations:
    # All actions allowed
    forge.dev/allowed-actions: "*"
    # All sources allowed
    forge.dev/allowed-source-repos: "*"
    forge.dev/allowed-source-buckets: "*"
    forge.dev/allowed-source-registries: "*"
    # All publish destinations allowed
    forge.dev/allowed-publish-buckets: "*"
    forge.dev/allowed-publish-registries: "*"
    # All deploy targets allowed
    forge.dev/allowed-deploy-targets: "*"
    # Allow local sources for development
    forge.dev/allow-local-sources: "true"

---
# =============================================================================
# EXAMPLE: Developer ServiceAccount (Restricted)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer
  namespace: forge-system
  annotations:
    # Build only - no publish or deploy
    forge.dev/allowed-actions: "Build,Create"
    # Only allowed to build from specific repos
    forge.dev/allowed-source-repos: "https://github.com/mycompany/dev-*"
    # No publish permissions (absent annotations = denied)
    # No deploy permissions

---
# =============================================================================
# EXAMPLE: External Cluster Deployer
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-deployer
  namespace: forge-system
  annotations:
    # Deploy only
    forge.dev/allowed-actions: "Deploy"
    # Can pull from production registry
    forge.dev/allowed-source-registries: "ghcr.io/mycompany/releases/*"
    # Only external cluster deployment
    forge.dev/allowed-deploy-targets: "ExternalCluster"
