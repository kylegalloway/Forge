# Example: Create UDS bundle from Git and publish to OCI
#
# This example demonstrates:
# - Creating a UDS bundle from Git repository
# - Publishing the bundle to an OCI registry
#
# The bundle definition and package content are in this directory (01-git-to-oci/)

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bundle-git-to-oci-builder
  namespace: default
  annotations:
    # Allow Create and Publish actions
    forge.dev/allowed-bundle-actions: "Create,Publish,CreatePublish"

    # Allow fetching from this repository
    forge.dev/allowed-bundle-source-repos: "https://github.com/kylegalloway/forge/*"

    # Allow publishing to target OCI registry
    forge.dev/allowed-bundle-publish-registries: "ghcr.io/myorg/bundles/*"

---
# Secret for OCI registry credentials
apiVersion: v1
kind: Secret
metadata:
  name: bundle-oci-credentials
  namespace: default
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6e319  # Replace with actual base64-encoded docker config

---
apiVersion: forge.dev/v1alpha1
kind: UDSBundleJob
metadata:
  name: git-to-oci-bundle-example
  namespace: default
spec:
  serviceAccountName: bundle-git-to-oci-builder

  # Create and Publish pipeline
  action: CreatePublish

  # Source: Git repository
  source:
    type: Git
    git:
      url: https://github.com/kylegalloway/forge
      ref: main
      path: examples/samples/uds/01-git-to-oci

  # Publish to OCI registry
  publish:
    destination:
      type: OCI
      oci:
        registry: ghcr.io
        repository: myorg/bundles/hello-git-to-oci-bundle
        tag: 1.0.0
        credentialsSecretRef:
          name: bundle-oci-credentials

  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 4
      memory: 8Gi
