# Example: Create UDS Bundle from Git and Deploy to Cluster
#
# This example demonstrates:
# - Creating a UDS bundle from a public Git repository
# - Deploying the bundle directly to the cluster
#
# This deploys Headlamp, a simple Kubernetes UI, as a UDS bundle

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bundle-git-build-deploy-sa
  namespace: default
  annotations:
    # Allow Create, Deploy, and CreateDeploy actions
    forge.dev/allowed-actions: "create,deploy,createdeploy"

    # Allow fetching from forge repository
    forge.dev/allowed-source-repos: "https://github.com/kylegalloway/forge/*"

    # Allow deploying to local cluster
    forge.dev/allowed-deploy-targets: "local,*"

---
apiVersion: forge.dev/v1alpha3
kind: UDSBundleJob
metadata:
  name: git-build-deploy-bundle-example
  namespace: default
spec:
  serviceAccountName: bundle-git-build-deploy-sa

  # Create and Deploy pipeline
  action: createdeploy

  # Source: Git repository containing the UDS bundle definition
  source:
    type: git
    git:
      url: https://github.com/kylegalloway/forge
      ref: main
      path: examples/samples/uds/03-git-build-deploy

  # Deploy configuration
  deploy:
    # Deploy to the cluster where the controller is running
    target: InCluster

    # Deploy all components (empty means all)
    components: []

  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 4
      memory: 8Gi
