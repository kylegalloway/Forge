# Example: Create UDS Bundle from Git and Deploy to Cluster (v1alpha2 API)
#
# This example demonstrates the NEW v1alpha2 API with unified naming:
# - UDSBundleJob → UDSPackageJob (matches ZarfPackageJob)
# - BundleAction → Action (consistent with Zarf)
# - Simplified annotation names
#
# This deploys Headlamp, a simple Kubernetes UI, as a UDS bundle

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bundle-git-build-deploy-sa-v2
  namespace: default
  annotations:
    # v1alpha2: Unified annotation names (no "bundle" prefix)
    # Allow Create, Deploy, and CreateDeploy actions
    forge.dev/allowed-actions: "Create,Deploy,CreateDeploy"

    # Allow fetching from forge repository
    forge.dev/allowed-source-repos: "https://github.com/kylegalloway/forge/*"

    # Allow deploying to headlamp namespace
    forge.dev/allowed-deploy-namespaces: "headlamp"

---
apiVersion: forge.dev/v1alpha2
kind: UDSPackageJob
metadata:
  name: git-build-deploy-bundle-example-v2
  namespace: default
spec:
  serviceAccountName: bundle-git-build-deploy-sa-v2

  # v1alpha2: Action type matches Zarf naming
  action: CreateDeploy

  # Source: Git repository containing the UDS bundle definition
  source:
    type: Git
    git:
      url: https://github.com/kylegalloway/forge
      ref: main
      path: examples/samples/uds/03-git-build-deploy

  # Deploy configuration
  deploy:
    target: InCluster
    namespace: headlamp
    timeout: "30m"

  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 4
      memory: 8Gi
