---
# Example: Build a minimal test package that will succeed
# This demonstrates a successful Forge workflow in Kind
apiVersion: forge.dev/v1alpha1
kind: ZarfPackageJob
metadata:
  name: hello-forge-test
  namespace: default
spec:
  # ServiceAccount controls what this package is allowed to do
  # Created by cluster admin with forge.forge.dev/* annotations
  serviceAccountName: developer-forge-sa

  action: Build

  source:
    type: Git
    git:
      url: https://github.com/kylegalloway/forge
      ref: main
      path: examples/test-packages/hello-forge

  # No publish or deploy config needed
  # Built artifact will be stored in job pod for verification
