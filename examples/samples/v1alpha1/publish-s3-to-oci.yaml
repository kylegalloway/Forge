---
# Example: Copy/publish a package from S3 to OCI registry
apiVersion: forge.dev/v1alpha1
kind: ZarfPackageJob
metadata:
  name: republish-example
  namespace: default
spec:
  # ServiceAccount controls what this package is allowed to do
  # Created by cluster admin with forge.forge.dev/* annotations
  serviceAccountName: developer-forge-sa
  action: PublishDeploy

  # Source: Package artifact in S3
  source:
    type: S3
    s3:
      bucket: artifacts-bucket
      key: packages/my-package-v1.0.0.tar.zst
      region: us-west-2
      credentialsSecretRef:
        name: s3-read-creds

  # Publish to OCI
  publish:
    destination:
      type: OCI
      oci:
        registry: registry.example.com
        repository: packages/my-package
        tag: v1.0.0
        credentialsSecretRef:
          name: registry-push-creds

  # Deploy to external cluster
  deploy:
    target: ExternalCluster
    externalCluster:
      kubeconfigSecretRef:
        name: prod-cluster-kubeconfig
      context: production
    namespace: default
    timeout: 30m
