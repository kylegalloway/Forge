kind: ZarfPackageConfig
metadata:
  name: hello-git-to-oci
  description: Example package built from Git source and published to OCI registry
  version: 1.0.0

variables:
  - name: REPLICA_COUNT
    description: Number of replicas for the hello-world deployment
    default: "1"

components:
  - name: hello-world
    required: true
    charts:
      - name: hello
        version: 0.1.0
        namespace: hello-world
        localPath: chart
