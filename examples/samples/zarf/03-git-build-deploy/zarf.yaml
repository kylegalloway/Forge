kind: ZarfPackageConfig
metadata:
  name: headlamp-example
  description: Headlamp Kubernetes UI built and deployed from Git
  version: 0.1.0

components:
  - name: headlamp-ui
    required: true
    charts:
      - name: headlamp
        version: 0.39.0
        namespace: headlamp
        url: https://kubernetes-sigs.github.io/headlamp/
        valuesFiles:
          - values.yaml
    images:
      - ghcr.io/headlamp-k8s/headlamp:v0.39.0
