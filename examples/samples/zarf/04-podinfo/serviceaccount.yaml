apiVersion: v1
kind: ServiceAccount
metadata:
  name: podinfo-builder
  namespace: default
  annotations:
    # Allow Build, Publish, and Deploy actions
    forge.dev/allowed-actions: "Build,Publish,Deploy,BuildPublish,BuildDeploy"

    # Allow fetching from forge repository
    forge.dev/allowed-source-repos: "https://github.com/kylegalloway/forge,https://github.com/kylegalloway/forge/*"

    # Allow publishing to any OCI registry (for testing)
    forge.dev/allowed-registries: "*"

    # Allow deploying to the cluster where the controller is running
    forge.dev/allowed-deploy-targets: "InCluster"

    # Allow deploying to default namespace
    forge.dev/allowed-deploy-namespaces: "default"
