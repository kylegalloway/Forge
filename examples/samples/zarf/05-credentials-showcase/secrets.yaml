# Credentials Showcase - Secret Definitions
# pragma: allowlist secret
#
# This file demonstrates all credential types supported by Forge.
# Replace placeholder values with real credentials before use.
#
# NOTE: All values in this file are EXAMPLES/PLACEHOLDERS.
# Do NOT use these credentials in production!
#
# Secret Types:
# 1. Git credentials (SSH key or token)
# 2. OCI registry credentials (dockerconfigjson)
# 3. S3 credentials (access key + secret)
# 4. Kubeconfig (for external cluster deployment)

---
# =============================================================================
# 1. GIT CREDENTIALS
# =============================================================================
# Used for cloning private Git repositories.
# Supports either SSH key or personal access token.

# Option A: Token-based authentication (GitHub, GitLab, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: git-token-credentials
  namespace: forge-jobs
type: Opaque
stringData:
  # GitHub Personal Access Token, GitLab token, etc.
  # token: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  # pragma: allowlist secret
  token: "REPLACE_WITH_YOUR_GIT_TOKEN"

---
# Option B: SSH key authentication
apiVersion: v1
kind: Secret
metadata:
  name: git-ssh-credentials
  namespace: forge-jobs
type: Opaque
stringData:
  # Private SSH key (ensure no passphrase)
  ssh-key: |  # pragma: allowlist secret
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_WITH_YOUR_SSH_PRIVATE_KEY
    -----END OPENSSH PRIVATE KEY-----

---
# =============================================================================
# 2. OCI REGISTRY CREDENTIALS
# =============================================================================
# Used for pulling/pushing images and artifacts from/to OCI registries.
# Must be type kubernetes.io/dockerconfigjson

# Primary registry (e.g., for publishing)
apiVersion: v1
kind: Secret
metadata:
  name: oci-publish-credentials
  namespace: forge-jobs
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "REPLACE_WITH_USERNAME",
          "password": "REPLACE_WITH_TOKEN_OR_PASSWORD"  # pragma: allowlist secret
        }
      }
    }

---
# Source registry (e.g., for pulling base images or OCI sources)
apiVersion: v1
kind: Secret
metadata:
  name: oci-source-credentials
  namespace: forge-jobs
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.example.com": {
          "username": "REPLACE_WITH_USERNAME",
          "password": "REPLACE_WITH_PASSWORD"  # pragma: allowlist secret
        }
      }
    }

---
# Multi-registry credentials (when you need access to multiple registries)
apiVersion: v1
kind: Secret
metadata:
  name: oci-multi-registry-credentials
  namespace: forge-jobs
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "REPLACE_WITH_USERNAME",
          "password": "REPLACE_WITH_GHCR_TOKEN"  # pragma: allowlist secret
        },
        "docker.io": {
          "username": "REPLACE_WITH_USERNAME",
          "password": "REPLACE_WITH_DOCKERHUB_TOKEN"  # pragma: allowlist secret
        },
        "registry.example.com": {
          "username": "REPLACE_WITH_USERNAME",
          "password": "REPLACE_WITH_PASSWORD"  # pragma: allowlist secret
        }
      }
    }

---
# =============================================================================
# 3. S3/AWS CREDENTIALS
# =============================================================================
# Used for pulling/pushing artifacts from/to S3 buckets.
# Works with AWS S3 and S3-compatible storage (MinIO, etc.)
#
# Forge supports THREE credential loading methods:
# - EnvVar (default): Load access-key-id and secret-access-key as env vars
# - File: Mount an AWS credentials file from the secret
# - Node: Use node-level credentials (IRSA, instance profile) - no secret needed

# Option A: EnvVar-based credentials (default, most common)
# Secret keys: 'access-key-id' and 'secret-access-key'
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials-envvar
  namespace: forge-jobs
type: Opaque
stringData:
  # AWS Access Key ID
  access-key-id: "AKIAIOSFODNN7EXAMPLE"  # pragma: allowlist secret
  # AWS Secret Access Key
  secret-access-key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"  # pragma: allowlist secret

---
# Option B: File-based credentials (AWS credentials file format)
# Mount as ~/.aws/credentials in the container
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials-file
  namespace: forge-jobs
type: Opaque
stringData:
  # AWS credentials file format  # pragma: allowlist secret
  credentials: |
    [default]
    aws_access_key_id = AKIAIOSFODNN7EXAMPLE
    aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

    [profile-with-session-token]
    aws_access_key_id = AKIAIOSFODNN7EXAMPLE
    aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    aws_session_token = FwoGZXIvYXdzEB...YOUR_SESSION_TOKEN

---
# Option C: Node-level credentials (IRSA, instance profile)
# No secret needed! AWS SDK automatically uses:
# - IRSA (IAM Roles for Service Accounts) on EKS
# - Instance profile on EC2
# - Task role on ECS
# Simply omit the credentialRef or set type: Node

---
# S3 credentials for MinIO or other S3-compatible storage
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: forge-jobs
type: Opaque
stringData:
  access-key-id: "minioadmin"
  secret-access-key: "minioadmin"

---
# =============================================================================
# 4. KUBECONFIG CREDENTIALS
# =============================================================================
# Used for deploying to external/remote Kubernetes clusters.

# Production cluster kubeconfig
apiVersion: v1
kind: Secret
metadata:
  name: prod-cluster-kubeconfig
  namespace: forge-jobs
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        server: https://prod-cluster.example.com:6443
        certificate-authority-data: LS0tLS1CRUdJTi... # Base64-encoded CA cert
      name: prod-cluster
    contexts:
    - context:
        cluster: prod-cluster
        user: deploy-user
        namespace: default
      name: prod-context
    current-context: prod-context
    users:
    - name: deploy-user
      user:
        # Option 1: Token-based auth
        token: "REPLACE_WITH_SERVICE_ACCOUNT_TOKEN"
        # Option 2: Client certificate auth (uncomment below)
        # client-certificate-data: LS0tLS1CRUdJTi...
        # client-key-data: LS0tLS1CRUdJTi...

---
# Staging cluster kubeconfig
apiVersion: v1
kind: Secret
metadata:
  name: staging-cluster-kubeconfig
  namespace: forge-jobs
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        server: https://staging-cluster.example.com:6443
        certificate-authority-data: LS0tLS1CRUdJTi...
      name: staging-cluster
    contexts:
    - context:
        cluster: staging-cluster
        user: deploy-user
      name: staging-context
    current-context: staging-context
    users:
    - name: deploy-user
      user:
        token: "REPLACE_WITH_SERVICE_ACCOUNT_TOKEN"

---
# =============================================================================
# SERVICE ACCOUNT
# =============================================================================
# ServiceAccount with permissions for all credential showcase examples

apiVersion: v1
kind: ServiceAccount
metadata:
  name: credentials-showcase-sa
  namespace: forge-jobs
  annotations:
    # Allow all actions for demonstration
    forge.dev/allowed-actions: "Build,Publish,Deploy,BuildPublish,BuildDeploy,PublishDeploy,BuildPublishDeploy"

    # Allow Git sources from these repos
    forge.dev/allowed-source-repos: "https://github.com/myorg/*,https://gitlab.example.com/*"

    # Allow S3 sources/destinations
    forge.dev/allowed-source-buckets: "my-source-bucket,my-artifacts-bucket"
    forge.dev/allowed-publish-buckets: "my-artifacts-bucket,my-releases-bucket"

    # Allow OCI registries
    forge.dev/allowed-source-registries: "registry.example.com/*,ghcr.io/myorg/*"
    forge.dev/allowed-publish-registries: "ghcr.io/myorg/*,registry.example.com/*"

    # Allow deployment targets
    forge.dev/allowed-deploy-clusters: "https://prod-cluster.example.com:6443,https://staging-cluster.example.com:6443"
