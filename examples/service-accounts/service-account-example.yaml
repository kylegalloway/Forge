---
# Example ServiceAccounts with Forge permissions
# NOTE: This file contains examples in multiple namespaces (production, platform-team)
# For quick testing in Kind, use simple-test-sa.yaml instead (only uses default namespace)
#
# To use this file, first create the namespaces:
#   kubectl create namespace production
#   kubectl create namespace platform-team
#
# Created by cluster admin to grant teams access to Forge operations

---
# Example: Developer ServiceAccount with limited permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer-forge-sa
  namespace: default
  annotations:
    # What actions this SA can perform
    forge.dev/allowed-actions: "Build,Publish"

    # Which Git repos can be used as sources (glob patterns)
    forge.dev/allowed-source-repos: "https://github.com/myorg/*,https://github.com/defenseunicorns/zarf"

    # Which OCI registries can be used for publishing (glob patterns)
    forge.dev/allowed-publish-registries: "ghcr.io/myorg/*"

    # Which S3 buckets can be used for publishing (glob patterns)
    forge.dev/allowed-publish-buckets: "my-artifacts-*"

    # Which deploy targets are allowed
    forge.dev/allowed-deploy-targets: "InCluster"

---
# Example: Production ServiceAccount with restricted permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-forge-sa
  namespace: production
  annotations:
    # Production can only deploy pre-built packages
    forge.dev/allowed-actions: "Deploy"

    # Can only pull from approved registries
    forge.dev/allowed-source-registries: "ghcr.io/myorg/prod/*"

    # Can only deploy to external clusters (not in-cluster)
    forge.dev/allowed-deploy-targets: "ExternalCluster"

---
# Example: Platform team ServiceAccount with full permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-team-forge-sa
  namespace: platform-team
  annotations:
    # Platform team can do everything
    forge.dev/allowed-actions: "Build,Publish,Deploy,BuildPublish,BuildDeploy,PublishDeploy,BuildPublishDeploy"

    # Can use any source
    forge.dev/allowed-source-repos: "*"
    forge.dev/allowed-source-buckets: "*"
    forge.dev/allowed-source-registries: "*"

    # Can publish anywhere
    forge.dev/allowed-publish-buckets: "*"
    forge.dev/allowed-publish-registries: "*"

    # Can deploy anywhere
    forge.dev/allowed-deploy-targets: "InCluster,ExternalCluster"
