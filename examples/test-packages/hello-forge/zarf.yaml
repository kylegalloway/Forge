kind: ZarfPackageConfig
metadata:
  name: hello-forge
  description: A minimal Zarf package for testing Forge builds
  version: 0.0.1

components:
  - name: hello-message
    required: true
    files:
      - source: message.txt
        target: /tmp/hello-forge.txt
    actions:
      onCreate:
        after:
          - cmd: echo "Forge built this package successfully!"
          - cmd: cat message.txt
