kind: ZarfPackageConfig
metadata:
  name: test-package
  description: "Simple test package for ScriptRunner Zarf builder"
  version: "0.1.0"
  architecture: amd64

components:
  - name: test-component
    required: true
    description: "A simple test component"
    files:
      - source: README.md
        target: /app/README.md
    actions:
      onDeploy:
        after:
          - cmd: echo "Test package deployed successfully!"
            description: "Verify deployment"
