---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-builder
  namespace: default
  annotations:
    forge.forge.dev/allowed-actions: "Build"
    forge.forge.dev/allowed-source-repos: "*"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-zarf-package
  namespace: default
data:
  zarf.yaml: |
    kind: ZarfPackageConfig
    metadata:
      name: test-package
      description: Simple test package for Forge
      version: 1.0.0

    components:
      - name: test-component
        description: A test component
        manifests:
          - name: test-manifest
            files:
              - manifest.yaml

  manifest.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: hello-from-forge
      namespace: default
    data:
      message: "Hello from Forge!"

---
apiVersion: forge.dev/v1alpha1
kind: ZarfPackageJob
metadata:
  name: test-build
  namespace: default
spec:
  serviceAccountName: test-builder
  action: Build

  source:
    type: Local
    local:
      configMapRef:
        name: test-zarf-package

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
