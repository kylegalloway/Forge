apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-uds-deployer
  namespace: default
  labels:
    app: forge-test
    test: e2e
  annotations:
    # Permissive policy for testing - allows all actions
    forge.dev/allowed-actions: "*"
    forge.dev/allowed-source-repos: "*"
    forge.dev/allowed-source-buckets: "*"
    forge.dev/allowed-source-registries: "*"
    forge.dev/allowed-publish-buckets: "*"
    forge.dev/allowed-publish-registries: "*"
    forge.dev/allowed-deploy-targets: "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: test-uds-deployer-admin
  labels:
    app: forge-test
    test: e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: test-uds-deployer
    namespace: default
