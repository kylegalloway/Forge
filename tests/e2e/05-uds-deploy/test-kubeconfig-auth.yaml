apiVersion: batch/v1
kind: Job
metadata:
  name: test-kubeconfig-auth
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: test-uds-deployer
      automountServiceAccountToken: true
      containers:
      - name: test
        image: localhost/uds-cli:v0.27.21
        command: ["/bin/sh"]
        args:
        - -c
        - |
          set -x
          echo "=== Environment ==="
          env | grep -i kube || echo "No KUBE vars"

          echo ""
          echo "=== API Server Info ==="
          echo "KUBERNETES_SERVICE_HOST: ${KUBERNETES_SERVICE_HOST:-not set}"
          echo "KUBERNETES_SERVICE_PORT: ${KUBERNETES_SERVICE_PORT:-not set}"

          echo "=== Setting up kubeconfig ==="
          SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
          mkdir -p /tmp/.kube
          TOKEN=$(cat $SA_DIR/token)

          # Use environment variables for API server endpoint if available
          API_SERVER="${KUBERNETES_SERVICE_HOST:-kubernetes.default.svc}:${KUBERNETES_SERVICE_PORT:-443}"

          # Create kubeconfig using echo with embedded token
          (
            echo "apiVersion: v1"
            echo "kind: Config"
            echo "clusters:"
            echo "- cluster:"
            echo "    certificate-authority: $SA_DIR/ca.crt"
            echo "    server: https://$API_SERVER"
            echo "  name: in-cluster"
            echo "contexts:"
            echo "- context:"
            echo "    cluster: in-cluster"
            echo "    namespace: default"
            echo "    user: service-account"
            echo "  name: in-cluster"
            echo "current-context: in-cluster"
            echo "users:"
            echo "- name: service-account"
            echo "  user:"
            echo "    token: $TOKEN"
          ) > /tmp/.kube/config

          echo ""
          echo "=== Generated kubeconfig ==="
          cat /tmp/.kube/config

          echo ""
          echo "=== CA file check ==="
          ls -la "$SA_DIR/ca.crt"
          echo "CA first 50 chars:"
          head -c 50 "$SA_DIR/ca.crt"
          echo ""

          echo ""
          echo "=== File permissions ==="
          ls -la /tmp/.kube/

          echo ""
          echo "=== Testing kubectl version ==="
          export KUBECONFIG=/tmp/.kube/config
          kubectl version --client

          echo ""
          echo "=== Testing kubectl get pods ==="
          kubectl get pods -n default

          echo ""
          echo "=== Testing kubectl cluster-info ==="
          kubectl cluster-info

          echo ""
          echo "SUCCESS: kubectl authenticated successfully!"
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: kube-api-access
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
              audience: "https://kubernetes.default.svc"
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      restartPolicy: Never
