apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-zarf-bpd
  namespace: default
  labels:
    app: forge-test
    test: e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forge-test-zarf-bpd
  labels:
    app: forge-test
    test: e2e
rules:
  # For building packages from Git
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  # For publishing (if using OCI destination)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # For deploying packages
  - apiGroups: [""]
    resources: ["configmaps", "services", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # For zarf deployment in zarf namespace
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "list"]

  # For admin deployment operations
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # For zarf components
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch"]

  # For secrets (e.g., for zarf deployment)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forge-test-zarf-bpd
  labels:
    app: forge-test
    test: e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forge-test-zarf-bpd
subjects:
  - kind: ServiceAccount
    name: test-zarf-bpd
    namespace: default
