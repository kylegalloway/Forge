apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-uds-cp
  namespace: default
  labels:
    app: forge-test
    test: e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forge-test-uds-cp
  labels:
    app: forge-test
    test: e2e
rules:
  # For creating bundles from packages
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  # For publishing bundles (registry access)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # For bundle composition validation
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forge-test-uds-cp
  labels:
    app: forge-test
    test: e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forge-test-uds-cp
subjects:
  - kind: ServiceAccount
    name: test-uds-cp
    namespace: default
