apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-uds-cpd
  namespace: default
  labels:
    app: forge-test
    test: e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forge-test-uds-cpd
  labels:
    app: forge-test
    test: e2e
rules:
  # For creating bundles from packages
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  # For publishing bundles
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # For deploying bundles to cluster
  - apiGroups: [""]
    resources: ["configmaps", "services", "pods", "namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # For helm releases and bundle components
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # For RBAC if bundle includes role bindings
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch"]

  # For bundle-specific resources
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]

  # For ingress if bundle uses it
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forge-test-uds-cpd
  labels:
    app: forge-test
    test: e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forge-test-uds-cpd
subjects:
  - kind: ServiceAccount
    name: test-uds-cpd
    namespace: default
