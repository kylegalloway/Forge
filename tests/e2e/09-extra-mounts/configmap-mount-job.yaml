apiVersion: forge.dev/v1alpha3
kind: ZarfPackageJob
metadata:
  name: test-cm-mount
  namespace: default
  labels:
    app: forge-test
    test: e2e
    feature: extra-mounts
spec:
  serviceAccountName: test-extra-mounts
  action: Build
  source:
    type: Git
    git:
      url: https://github.com/kylegalloway/forge
      ref: main
      path: examples/samples/zarf/03-git-build-deploy

  # Extra mounts - mount ConfigMap into job
  extraMounts:
    - configMapRef:
        name: test-app-config
      mountPath: /workspace/config
