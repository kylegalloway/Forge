apiVersion: forge.dev/v1alpha3
kind: ZarfPackageJob
metadata:
  name: test-secret-mount
  namespace: default
  labels:
    app: forge-test
    test: e2e
    feature: extra-mounts
spec:
  serviceAccountName: test-extra-mounts
  action: Build
  source:
    type: Git
    git:
      url: https://github.com/kylegalloway/forge
      ref: main
      path: examples/samples/zarf/03-git-build-deploy

  # Extra mounts - mount Secret into job
  extraMounts:
    - source:
        type: Secret
        secret:
          name: test-app-secrets
      destination: /workspace/secrets
