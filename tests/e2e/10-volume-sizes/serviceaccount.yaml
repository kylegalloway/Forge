apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-volume-sizes
  namespace: default
  labels:
    app: forge-test
    test: e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-volume-sizes
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-volume-sizes
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: test-volume-sizes
subjects:
  - kind: ServiceAccount
    name: test-volume-sizes
    namespace: default
