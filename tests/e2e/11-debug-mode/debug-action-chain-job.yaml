apiVersion: forge.dev/v1alpha3
kind: ZarfPackageJob
metadata:
  name: test-debug-action-chain
  namespace: default
  labels:
    app: forge-test
    test: e2e
    feature: debug-mode
    action-chain: "true"
spec:
  serviceAccountName: test-debug-mode
  action: BuildPublishDeploy
  source:
    type: Git
    git:
      url: https://github.com/kylegalloway/forge
      ref: main
      path: examples/samples/zarf/03-git-build-deploy

  publish:
    destination:
      type: OCI
      oci:
        registry: "localhost:5000"
        repository: "debug-test"
        tag: "latest"

  deploy:
    target: InCluster

  # Per-action debug control in action chain
  debugMode: true
  debugActions: ["build"]
