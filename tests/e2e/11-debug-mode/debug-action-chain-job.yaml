apiVersion: forge.dev/v1alpha3
kind: ZarfPackageJob
metadata:
  name: test-debug-action-chain
  namespace: default
  labels:
    app: forge-test
    test: e2e
    feature: debug-mode
    action-chain: "true"
spec:
  serviceAccountName: test-debug-mode
  action: BuildPublishDeploy
  source:
    type: Git
    git:
      url: https://github.com/kylegalloway/forge
      ref: main
      path: examples/samples/zarf/03-git-build-deploy

  publish:
    type: OCI
    oci:
      destination: "localhost:5000/debug-test"

  deploy:
    target: InCluster

  # Per-action debug control in action chain
  actions:
    - name: Build
      debug: true  # Debug the build phase
    - name: Publish
      debug: false # Publish runs automatically
    - name: Deploy
      debug: false # Deploy runs automatically

  # Keep for debugging
  ttlSecondsAfterFinished: 3600
