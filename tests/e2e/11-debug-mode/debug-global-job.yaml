apiVersion: forge.dev/v1alpha3
kind: ZarfPackageJob
metadata:
  name: test-debug-global
  namespace: default
  labels:
    app: forge-test
    test: e2e
    feature: debug-mode
spec:
  serviceAccountName: test-debug-mode
  action: Build
  source:
    type: Git
    git:
      url: https://github.com/kylegalloway/forge
      ref: main
      path: examples/samples/zarf/03-git-build-deploy

  # Global debug mode - pauses job execution
  debug: true

  # Keep pod around for debugging (1 hour)
  ttlSecondsAfterFinished: 3600
