apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forge-webhook-cert
  namespace: forge-system
  labels:
    app: forge-webhook
spec:
  secretName: forge-webhook-certs
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  subject:
    organizations:
    - forge
  commonName: forge-webhook.forge-system.svc
  dnsNames:
  - forge-webhook
  - forge-webhook.forge-system
  - forge-webhook.forge-system.svc
  - forge-webhook.forge-system.svc.cluster.local
  issuerRef:
    name: forge-webhook-issuer
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: forge-webhook-issuer
  namespace: forge-system
  labels:
    app: forge-webhook
spec:
  selfSigned: {}
