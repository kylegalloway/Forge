apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: forge-webhook
  labels:
    app: forge-webhook
  annotations:
    cert-manager.io/inject-ca-from: forge-system/forge-webhook-cert
webhooks:
- name: validate.forge.io
  admissionReviewVersions: ["v1"]
  clientConfig:
    service:
      name: forge-webhook
      namespace: forge-system
      path: /validate
    caBundle: Cg==  # Will be injected by cert-manager
  rules:
  - apiGroups: ["forge.io"]
    apiVersions: ["v1alpha1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["forges"]
    scope: "Namespaced"
  sideEffects: None
  failurePolicy: Fail
  timeoutSeconds: 10
  namespaceSelector:
    matchExpressions:
    - key: forge.io/webhook
      operator: NotIn
      values: ["disabled"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: forge-webhook
  labels:
    app: forge-webhook
  annotations:
    cert-manager.io/inject-ca-from: forge-system/forge-webhook-cert
webhooks:
- name: mutate.forge.io
  admissionReviewVersions: ["v1"]
  clientConfig:
    service:
      name: forge-webhook
      namespace: forge-system
      path: /mutate
    caBundle: Cg==  # Will be injected by cert-manager
  rules:
  - apiGroups: ["forge.io"]
    apiVersions: ["v1alpha1"]
    operations: ["CREATE"]
    resources: ["forges"]
    scope: "Namespaced"
  sideEffects: None
  failurePolicy: Ignore  # Don't block on mutation failures
  timeoutSeconds: 10
  namespaceSelector:
    matchExpressions:
    - key: forge.io/webhook
      operator: NotIn
      values: ["disabled"]
