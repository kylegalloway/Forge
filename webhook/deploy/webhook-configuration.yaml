apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: scriptrunner-webhook
  labels:
    app: scriptrunner-webhook
  annotations:
    cert-manager.io/inject-ca-from: forge-system/scriptrunner-webhook-cert
webhooks:
- name: validate.scriptrunner.io
  admissionReviewVersions: ["v1"]
  clientConfig:
    service:
      name: scriptrunner-webhook
      namespace: forge-system
      path: /validate
    caBundle: Cg==  # Will be injected by cert-manager
  rules:
  - apiGroups: ["scriptrunner.io"]
    apiVersions: ["v1alpha1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["scriptrunners"]
    scope: "Namespaced"
  sideEffects: None
  failurePolicy: Fail
  timeoutSeconds: 10
  namespaceSelector:
    matchExpressions:
    - key: scriptrunner.io/webhook
      operator: NotIn
      values: ["disabled"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: scriptrunner-webhook
  labels:
    app: scriptrunner-webhook
  annotations:
    cert-manager.io/inject-ca-from: forge-system/scriptrunner-webhook-cert
webhooks:
- name: mutate.scriptrunner.io
  admissionReviewVersions: ["v1"]
  clientConfig:
    service:
      name: scriptrunner-webhook
      namespace: forge-system
      path: /mutate
    caBundle: Cg==  # Will be injected by cert-manager
  rules:
  - apiGroups: ["scriptrunner.io"]
    apiVersions: ["v1alpha1"]
    operations: ["CREATE"]
    resources: ["scriptrunners"]
    scope: "Namespaced"
  sideEffects: None
  failurePolicy: Ignore  # Don't block on mutation failures
  timeoutSeconds: 10
  namespaceSelector:
    matchExpressions:
    - key: scriptrunner.io/webhook
      operator: NotIn
      values: ["disabled"]
