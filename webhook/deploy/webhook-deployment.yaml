apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-webhook
  namespace: forge-system
  labels:
    app: forge-webhook
    app.kubernetes.io/name: forge-webhook
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: forge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forge-webhook
  template:
    metadata:
      labels:
        app: forge-webhook
    spec:
      serviceAccountName: forge-webhook
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: webhook
        image: forge-webhook:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        args:
        - -v=2
        - --tls-cert-file=/etc/webhook/certs/tls.crt
        - --tls-key-file=/etc/webhook/certs/tls.key
        - --config=/etc/webhook/config/config.json
        volumeMounts:
        - name: webhook-certs
          mountPath: /etc/webhook/certs
          readOnly: true
        - name: webhook-config
          mountPath: /etc/webhook/config
          readOnly: true
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: webhook-certs
        secret:
          secretName: forge-webhook-certs
      - name: webhook-config
        configMap:
          name: forge-webhook-config
---
apiVersion: v1
kind: Service
metadata:
  name: forge-webhook
  namespace: forge-system
  labels:
    app: forge-webhook
spec:
  ports:
  - name: https
    port: 443
    targetPort: 8443
  selector:
    app: forge-webhook
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forge-webhook
  namespace: forge-system
  labels:
    app: forge-webhook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forge-webhook-role
  labels:
    app: forge-webhook
rules:
# Webhook needs minimal permissions - just read access to validate
- apiGroups:
  - forge.io
  resources:
  - forges
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forge-webhook-rolebinding
  labels:
    app: forge-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forge-webhook-role
subjects:
- kind: ServiceAccount
  name: forge-webhook
  namespace: forge-system
