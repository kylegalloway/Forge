kind: ZarfPackageConfig
metadata:
  name: forge
  description: "Forge - Kubernetes controller for managing Zarf package and UDS bundle operations"
  version: "0.11.14"
  url: https://github.com/kylegalloway/forge
  authors: Kyle Galloway
  architecture: multi
  documentation: https://github.com/kylegalloway/forge

components:
  # Core Forge component - controller and webhook
  - name: forge
    description: "Forge controller and admission webhook for declarative Zarf/UDS operations"
    required: true
    charts:
      - name: forge
        localPath: chart/forge
        namespace: forge-system
        version: 0.11.14
        valuesFiles:
          - chart/forge/values.yaml
    images:
      # Forge controller image
      - ghcr.io/kylegalloway/forge/forge-controller:v0.11.14
      # Forge webhook image
      - ghcr.io/kylegalloway/forge/forge-webhook:v0.11.14

  # Forge Zarf package job image for running ZarfPackageJobs
  - name: zarfpackagejob
    description: "Forge container image used by ZarfPackageJobs to run package build/deploy/publish jobs"
    required: true
    images:
      - ghcr.io/kylegalloway/forge/zarfpackagejob:v0.11.14

  # Forge UDS bundle job image for running UDSBundleJobs
  - name: udsbundlejob
    description: "Forge container image used by UDSBundleJobs to run bundle create/deploy/publish jobs"
    required: true
    images:
      - ghcr.io/kylegalloway/forge/udsbundlejob:v0.11.14

  # Optional: Image scanning tools
  - name: image-scanning
    description: "Image scanning tools (Trivy and Grype) for vulnerability scanning in build jobs"
    required: false
    images:
      - aquasec/trivy:0.57.1
      - anchore/grype:v0.83.0
